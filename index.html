<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tinebox Loop">
<title>Tinebox Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Doto:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --body:#E2E4E0; --body-2:#D3D6D1; --panel:#EDEEEA; --line:#C6CAC3; --key:#FFFFFF; --key-edge:#B5BAB2; --key-down:#E9EEF8;
  --ink:#1A1E21; --ink-2:#5E666B; --screen:#000; --scr-ink:#DDF1FF; --scr-dim:#7B95A3;
  --rec:#D5362B; --go:#2E66D6; --ok:#2F8A5E; --warn:#B9791A; --syn:#7A5BD0; --drm:#C9602E; --gtr:#2E66D6; --focus:#2E66D6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --body:#1C1F21; --body-2:#141719; --panel:#25292B; --line:#3A4043; --key:#32373A; --key-edge:#0E1012; --key-down:#2A3240; --ink:#E8EBE7; --ink-2:#A0A7A3; --scr-dim:#6F8A99; --go:#5B8CF0; --gtr:#5B8CF0; --syn:#9A80EA; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;color:var(--ink);background:var(--body);font-family:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;font-size:16px;line-height:1.3;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
select,input{font:inherit;font-size:16px;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0}
.panel{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
.dot{font-family:'Doto',ui-monospace,monospace;font-weight:900}

/* the screen: state, section, position */
.screen{flex:none;background:var(--screen);color:var(--scr-ink);border-radius:14px;padding:10px 14px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
#scState{font-size:22px;font-weight:700;line-height:1.15;min-height:26px}
#scSmall{grid-column:1/3;font-size:14px;color:var(--scr-dim);min-height:18px}
#scPos{font-size:30px;line-height:1;align-self:center;text-align:right;white-space:nowrap}
#scPos.rec{color:#ff6a5e}
.ring{grid-column:1/3;height:6px;border-radius:3px;background:#1A2025;overflow:hidden;margin-top:6px;position:relative}
.ring i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--scr-ink);opacity:.8}
.chips{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.chip{border:1px solid #2C353B;border-radius:999px;padding:1px 8px;color:var(--scr-dim)}
.chip.on{color:var(--scr-ink);border-color:var(--scr-ink)}
.chip.bad{color:#ff8a7e;border-color:#ff8a7e}

/* tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);border-top:1px solid var(--line);background:var(--body)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 2px;font-size:15px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink)}

/* switches: the footswitch mirrored on screen */
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sw button{min-height:68px;border-radius:14px;border:1px solid var(--key-edge);background:var(--key);box-shadow:0 2px 0 var(--key-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.sw button:active{transform:translateY(1px);box-shadow:0 1px 0 var(--key-edge);background:var(--key-down)}
.sw b{font-size:17px}
.sw small{font-size:12px;color:var(--ink-2)}
.sw button.flash{background:var(--key-down)}
.sw button.on{border-color:var(--rec);box-shadow:0 2px 0 var(--rec);color:var(--rec)}
.sw .n{font-size:11px;color:var(--ink-2);font-weight:700}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:17px}
.note{font-size:14px;color:var(--ink-2);margin:6px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.row .lbl{flex:1;min-width:120px}
.btn{border:1px solid var(--key-edge);background:var(--key);border-radius:10px;padding:7px 12px;font-weight:600;font-size:15px}
.btn.sm{padding:4px 9px;font-size:14px}
.btn.pri{background:var(--go);border-color:var(--go);color:#fff}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--body);border-color:var(--ink)}
select{border:1px solid var(--key-edge);background:var(--key);border-radius:8px;padding:5px 8px}
input[type=range]{flex:1;min-width:120px}

/* layers */
.layer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.layer:first-of-type{border-top:0}
.ltag{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
.ltag.gtr{background:var(--gtr)} .ltag.syn{background:var(--syn)} .ltag.drm{background:var(--drm)}
.lst{font-size:14px;color:var(--ink-2)}
.lst.pend{color:var(--warn);font-weight:700}
.lst.tape{color:var(--ok)}
.lact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lopt{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* pads */
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.pad{aspect-ratio:1/0.85;border-radius:16px;border:1px solid var(--key-edge);background:var(--key);box-shadow:0 3px 0 var(--key-edge);font-size:17px;font-weight:700;touch-action:none}
.pad.hit{background:var(--key-down);transform:translateY(2px);box-shadow:0 1px 0 var(--key-edge)}

/* sections */
.sec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.sec .let{font-size:30px;line-height:1;width:40px;text-align:center}
.sec.cur{outline:2px solid var(--go);outline-offset:-1px}
.sec .sum{font-size:14px;color:var(--ink-2)}
.sec .acts{grid-column:1/4;display:flex;gap:6px;flex-wrap:wrap}

/* count-in and test banner */
.count-big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:40vw;color:var(--rec);pointer-events:none;z-index:40;text-shadow:0 0 30px rgba(0,0,0,.25)}
.banner{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:50;background:#111;color:#F3F5F2;border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;max-width:624px;margin:0 auto}
.banner b{display:block;font-size:22px;line-height:1.2}
.banner span{display:block;font-size:15px;color:#C9D2D6;margin-top:4px}
.banner .bt{font-family:'Doto',ui-monospace,monospace;font-weight:900;font-size:26px;color:#9fd1ff;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:var(--ink);color:var(--body);padding:9px 14px;border-radius:12px;font-size:15px;z-index:60;max-width:92vw;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
.diag{position:fixed;inset:0;background:var(--body);z-index:45;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 120px}
.diag .wrap{max-width:640px;margin:0 auto}
.diag h2{margin:4px 0 8px}
.dgres{font-size:14px;white-space:pre-wrap;color:var(--ink-2);margin:6px 0;font-family:ui-monospace,Menlo,monospace}
.meterbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;flex:1;min-width:100px}
.meterbar i{display:block;height:100%;width:0;background:var(--ok)}
textarea.copy{width:100%;height:120px;font-size:12px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1A1E21">
</head>
<body>
<div id="app">
  <div class="screen" aria-live="polite">
    <div id="scState">Tinebox Loop</div>
    <div id="scPos" class="dot">–</div>
    <div id="scSmall">Connect the TP-7 (Settings), then tap switch 6 four times for a session.</div>
    <div class="ring" aria-hidden="true"><i id="scRing"></i></div>
    <div class="chips" id="scChips"></div>
  </div>
  <main class="panel" id="pLoop"></main>
  <main class="panel" id="pPads" hidden></main>
  <main class="panel" id="pSecs" hidden></main>
  <main class="panel" id="pSet" hidden></main>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="Loop" aria-selected="true">Loop</button>
    <button role="tab" data-tab="Pads" aria-selected="false">Pads</button>
    <button role="tab" data-tab="Secs" aria-selected="false">Sections</button>
    <button role="tab" data-tab="Set" aria-selected="false">Settings</button>
  </nav>
</div>
<div id="toast" role="status"></div>
<script>
// Guitar to synth DSP for Tinebox Loop. One self-contained factory, so the same code runs in the audio worklet (live preview),
// in a worker (the exact version printed to tape) and in Node (offline tests). No DOM, no Web Audio.
function GDSP(){
'use strict';
const TAU=2*Math.PI, mtof=m=>440*Math.pow(2,(m-69)/12), ftom=f=>69+12*Math.log2(f/440);

function fft(re,im){ const n=re.length;
  for(let i=1,j=0;i<n;i++){ let b=n>>1; for(;j&b;b>>=1) j^=b; j^=b; if(i<j){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
  for(let len=2;len<=n;len<<=1){ const a=-TAU/len, wr=Math.cos(a), wi=Math.sin(a), h=len>>1;
    for(let i=0;i<n;i+=len){ let cr=1, ci=0; for(let k=0;k<h;k++){ const p=i+k, q=p+h, tr=re[q]*cr-im[q]*ci, ti=re[q]*ci+im[q]*cr; re[q]=re[p]-tr; im[q]=im[p]-ti; re[p]+=tr; im[p]+=ti; const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr; } } } }

// ------------------------------------------------------------------ decimation to about 24 kHz
// a 4th-order Butterworth low-pass (two biquads) at 9.5 kHz, then every D-th sample
function Decim(srIn,target){ const D=Math.max(1,Math.round(srIn/(target||24000))); this.D=D; this.sr=srIn/D; this.ph=0; this.z=new Float64Array(8);
  const fc=Math.min(9500,0.4*this.sr), w0=TAU*fc/srIn, cw=Math.cos(w0), sw=Math.sin(w0);
  this.c=[0.5412,1.3066].map(Q=>{ const al=sw/(2*Q), a0=1+al; return [(1-cw)/2/a0,(1-cw)/a0,(1-cw)/2/a0,-2*cw/a0,(1-al)/a0]; }); }
Decim.prototype.run=function(x,n,out,o){ const D=this.D, z=this.z, c=this.c; let k=o;
  if(D===1){ for(let i=0;i<n;i++) out[k++]=x[i]; return k-o; }
  for(let i=0;i<n;i++){ let v=x[i];
    for(let s=0;s<2;s++){ const b=c[s], j=4*s, y=b[0]*v+b[1]*z[j]+b[2]*z[j+1]-b[3]*z[j+2]-b[4]*z[j+3]; z[j+1]=z[j]; z[j]=v; z[j+3]=z[j+2]; z[j+2]=y; v=y; }
    if(this.ph===0) out[k++]=v; this.ph=(this.ph+1)%D; }
  return k-o; };

// ------------------------------------------------------------------ the multi-pitch tracker: which notes sound now, and how loud
// Per frame: spectral peaks (parabolic interpolation on the log magnitude), then pitches one at a time by harmonic salience (the sum of
// weighted peaks at the harmonics of each candidate, weights after Klapuri 2006), each found pitch taking its share of its harmonics
// out of the spectrum (spectral smoothness: at most the average of its neighbouring harmonics), until what is left is too weak.
function Tracker(sr,N,o){ o=o||{}; this.sr=sr; this.N=N; this.mMin=o.mMin||38; this.mMax=o.mMax||90; this.poly=o.poly||6; this.rel=o.rel==null?0.16:o.rel; this.floor=o.floor||0.00004; this.prune=!!o.prune; this.fine=o.fine!==false; this.cand=new Int32Array(128); this.take=new Int32Array(16); this.seen=new Uint8Array(128); this.top=new Int32Array(12); this.cnt=0; this.low=0;
  const w=this.w=new Float64Array(N), skew=o.skew||0; // skew: 0 symmetric Hann; 0.75: rises over 3/4 and falls over the last 1/4 (less delay, live)
  if(!skew){ for(let i=0;i<N;i++) w[i]=0.5-0.5*Math.cos(TAU*i/(N-1)); }
  else { const R=Math.round(N*skew), F=N-R; for(let i=0;i<R;i++) w[i]=0.5-0.5*Math.cos(Math.PI*i/R); for(let i=0;i<F;i++) w[R+i]=0.5+0.5*Math.cos(Math.PI*i/F); }
  let s=0; for(let i=0;i<N;i++) s+=w[i]; this.ws=s; this.re=new Float64Array(N); this.im=new Float64Array(N); this.mag=new Float64Array(N>>1);
  this.k0=Math.max(2,Math.floor(55*N/sr)); this.k1=Math.min((N>>1)-2,Math.floor(Math.min(6000,0.45*sr)*N/sr));
  this.delay=skew?(N-Math.round(N*skew))/sr:N/2/sr; // how far the frame's weight sits before its end
  this.Pf=new Float64Array(512); this.Pa=new Float64Array(512); this.Pr=new Float64Array(512); this.np=0; }
const KW=(h)=>1/Math.pow(h,0.35);
Tracker.prototype.peaks=function(){ const m=this.mag, sr=this.sr, N=this.N, sc=2/this.ws; let mx=0;
  for(let k=this.k0;k<=this.k1;k++) if(m[k]>mx) mx=m[k];
  const thr=Math.max(this.floor/sc,mx*0.0032); let n=0; // peaks within 50 dB of the strongest
  for(let k=this.k0+1;k<this.k1&&n<512;k++){ const v=m[k]; if(v>thr&&v>m[k-1]&&v>=m[k+1]){ const a=Math.log(m[k-1]+1e-12), b=Math.log(v+1e-12), c=Math.log(m[k+1]+1e-12), den=a-2*b+c, d=den<0?0.5*(a-c)/den:0, dd=Math.max(-0.5,Math.min(0.5,d));
      this.Pf[n]=(k+dd)*sr/N; this.Pa[n]=Math.exp(b-0.25*(a-c)*dd)*sc; n++; } }
  this.np=n; return mx*sc; };
// the salience of f0 over the residual peaks, and which peak each harmonic took. Mild weights (1/h^0.35) so a low string's many
// harmonics outweigh its 4th harmonic taken as a note; a candidate missing many of its first 6 harmonics is scaled down (that rules
// out sub-octaves); a low candidate (under 140 Hz) needs its own fundamental, so a chord's common sub-harmonic is not taken as a note
Tracker.prototype.sal=function(f0,take){ const P=this.Pf, A=this.Pr, n=this.np; let s=0, cnt=0, lo=0, h1=0, mx=0, f6=0;
  const H=Math.min(12,Math.floor(Math.min(5000,0.45*this.sr)/f0)), H6=Math.min(6,H);
  for(let h=1;h<=H;h++){ const t=h*f0, tol=t*(Math.pow(2,(30+4*h)/1200)-1); while(lo<n&&P[lo]<t-tol) lo++; let best=-1, bd=1e9;
    for(let j=lo;j<n&&P[j]<=t+tol;j++){ const d=Math.abs(P[j]-t); if(A[j]>0&&d<bd){ bd=d; best=j; } }
    if(take) take[h]=best; if(best<0) continue; const g=1-0.5*(bd/tol)*(bd/tol), a=A[best]; s+=KW(h)*Math.sqrt(a)*g; cnt++; if(h<=H6) f6++; if(h===1) h1=a; if(a>mx) mx=a; }
  if(H6>0) s*=f6/H6;
  const ok=f0<140?h1>=0.02*mx&&h1>0:true;
  // results in fields, not a new object per call (the live tracker runs in the audio thread, where garbage collection pauses hurt)
  this.cnt=f0>1000?cnt+1:cnt; this.low=h1>0||(take&&take[2]>=0)||cnt>=3?1:0; return ok?s:0; };
// one frame: x[off .. off+N) at this.sr. Returns {lvl, notes:[{m, f, a}]} (a: amplitude of the note's partials)
Tracker.prototype.frame=function(x,off){ const N=this.N, re=this.re, im=this.im, w=this.w;
  for(let i=0;i<N;i++){ re[i]=x[off+i]*w[i]; im[i]=0; } fft(re,im); for(let k=0;k<N>>1;k++) this.mag[k]=Math.hypot(re[k],im[k]);
  const lvl=this.peaks(), out=[]; if(lvl<this.floor||this.np<1) return {lvl,notes:out};
  for(let j=0;j<this.np;j++) this.Pr[j]=this.Pa[j];
  let first=0; const take=this.take;
  // candidates: every pitch in range, or (prune, live) only those whose 1st, 2nd or 3rd harmonic is one of the 12 strongest peaks
  let nc=0; const C=this.cand;
  if(this.prune){ const T=this.top, sn=this.seen; let nt=0; sn.fill(0);
    for(let j=0;j<this.np;j++){ const a=this.Pa[j]; if(nt<12){ T[nt++]=j; } else { let lo=0; for(let q=1;q<12;q++) if(this.Pa[T[q]]<this.Pa[T[lo]]) lo=q; if(a>this.Pa[T[lo]]) T[lo]=j; } }
    for(let q=0;q<nt;q++) for(let d=1;d<=3;d++){ const m=Math.round(ftom(this.Pf[T[q]]/d)); if(m>=this.mMin&&m<=this.mMax&&!sn[m]){ sn[m]=1; C[nc++]=m; } } }
  else for(let m=this.mMin;m<=this.mMax;m++) C[nc++]=m;
  for(let it=0;it<this.poly;it++){ let bm=-1, bs=0;
    for(let q=0;q<nc;q++){ const m=C[q], v=this.sal(mtof(m)); if(this.cnt>=2&&this.low&&v>bs){ bs=v; bm=m; } }
    if(bm<0) break; if(!first) first=bs; else if(bs<this.rel*first) break;
    // the exact pitch: ±45 cents in 5-cent steps (offline), or from the matched fundamental or 2nd harmonic (live)
    let bf=mtof(bm), bf_s=bs;
    if(this.fine){ for(let c=-45;c<=45;c+=5){ if(!c) continue; const f=mtof(bm+c/100), v=this.sal(f); if(v>bf_s){ bf_s=v; bf=f; } } }
    else { this.sal(bf,take); if(take[1]>=0) bf=this.Pf[take[1]]; else if(take[2]>=0) bf=this.Pf[take[2]]/2; }
    this.sal(bf,take); const H=Math.min(14,Math.floor(Math.min(5500,0.45*this.sr)/bf)), amps=[];
    for(let h=1;h<=H;h++) amps[h]=take[h]>=0?this.Pr[take[h]]:0;
    if(!(amps[1]>0)&&!(amps[2]>0)) break;
    // smoothness: a harmonic gives up at most what its neighbours (h-1, h+1) suggest, so a coinciding note (an octave, a fifth) keeps
    // the rest; the fundamental is taken whole
    let e=0; for(let h=1;h<=H;h++){ const j=take[h]; if(j<0) continue; const nb=[amps[h-1],amps[h+1]].filter(v=>v!=null&&v>0), av=nb.length?nb.reduce((p,q)=>p+q,0)/nb.length:amps[h], sh=h===1?this.Pr[j]:Math.min(this.Pr[j],av);
      e+=sh*sh; this.Pr[j]-=sh; }
    out.push({m:Math.round(ftom(bf)),f:bf,a:Math.sqrt(e),s:bs}); }
  return {lvl,notes:out}; };

// ------------------------------------------------------------------ attacks: the pick's attack, as in Tinebox build 69
// the signal high-passed at 2.5 kHz (the attack, not the ringing strings), energy in 1 ms bins; an attack is the next 5 ms rising at
// least 7 dB over the 45 ms before; its time is where the level first reaches 30 % of the rise
function onsets(x,sr,o){ o=o||{}; const rise=o.rise||7, fc=2500, w0=TAU*fc/sr, cw=Math.cos(w0), al=Math.sin(w0)/(2*0.7071), a0=1+al;
  const b=[(1+cw)/2/a0,-(1+cw)/a0,(1+cw)/2/a0,-2*cw/a0,(1-al)/a0], z=[0,0,0,0], B=Math.max(1,Math.round(sr/1000)), nb=Math.floor(x.length/B), e=new Float64Array(nb);
  for(let i=0,k=0;k<nb;k++){ let s=0; for(let j=0;j<B;j++,i++){ const v=x[i], y=b[0]*v+b[1]*z[0]+b[2]*z[1]-b[3]*z[2]-b[4]*z[3]; z[1]=z[0]; z[0]=v; z[3]=z[2]; z[2]=y; s+=y*y; } e[k]=s/B; }
  let mx=0; for(let k=0;k<nb;k++) if(e[k]>mx) mx=e[k]; const flo=Math.max(mx*1e-5,1e-11), out=[]; let last=-1e9;

  if(bytes[0]===0xF0||(bytes[0]&0xF0)===0xB0||(bytes[0]&0xF0)===0x90) sxLog('out',bytes,due);
  const o=R.midi.outputs.get(R.outId); if(!o) return;
  if(R.midiNative&&due>now+2&&!tag){ try{ o.send(bytes,due); }catch(e){} return; }
  R.mq.push({due,bytes,n:++R.mqN,tag}); R.mq.sort((a,b)=>a.due-b.due||a.n-b.n); midiPump(); }
function midiSend(bytes,at,tag){ midiSendPerf(bytes,at==null||!ctx?null:audioToPerf(at)+midiOffset(),tag); }
const mNow=b=>midiSendPerf(b);
function midiPump(){ const q=R.mq; clearTimeout(R.mqT); if(!q.length) return; const now=performance.now(), o=R.midi&&R.midi.outputs.get(R.outId);
  while(q.length&&q[0].due<=now+1.5){ const m=q.shift(); if(o) try{ o.send(m.bytes); }catch(e){} }
  if(q.length) R.mqT=setTimeout(midiPump,Math.max(0,q[0].due-performance.now()-1)); }
function midiPurge(tag){ let n=0; for(let i=R.mq.length-1;i>=0;i--) if(R.mq[i].tag===tag){ R.mq.splice(i,1); n++; } if(n) log('st',`${n} scheduled message${n>1?'s':''} cancelled`); }

const hx=d=>[...d].map(x=>x.toString(16).padStart(2,'0')).join(' ');
function sx7(b){ const o=[]; for(let i=0;i<b.length;i+=8){ const m=b[i]; for(let j=0;j<7&&i+1+j<b.length;j++) o.push(b[i+1+j]|(((m>>j)&1)<<7)); } return o; }
function pack7(v){ const o=[]; for(let i=0;i<v.length;i+=7){ const g=v.slice(i,i+7); let m=0; g.forEach((x,j)=>{ if(x&0x80) m|=1<<j; }); o.push(m,...g.map(x=>x&0x7F)); } return o; }
const asc=v=>String.fromCharCode(...v.filter(x=>x>=32&&x<127));
const u32le=(v,i)=>((v[i]|(v[i+1]<<8)|(v[i+2]<<16)|(v[i+3]<<24))>>>0);
let sxId=0; const sxSent={};
const SXOP={session:0x40,play:0x50,stop:0x51,edit:0x04,start:0x4a};
const SXN={0x40:'Start Session',0x50:'Play',0x51:'Stop',0x04:'Edit mode toggle',0x4a:'Go to start',0x09:'Select track',0x0a:'Set input',0x0b:'Read track',0x0c:'Read input',0x01:'Greet'};
// 25 Oct, 18:00: input codes 0 line 1, 3 mic, 4 erase, 5 USB 1, 6 USB 2, 7 USB 3; one edit-mode setting for all tracks
const TPIN={line1:0,mic:3,erase:4,usb1:5,usb2:6,usb3:7}, TPIN_NAME={0:'line 1',3:'mic',4:'erase',5:'USB 1',6:'USB 2',7:'USB 3'};
const inName=c=>c==null?'?':TPIN_NAME[c]||`code ${c}`;
function sxReq(cmd,payload){ sxId=sxId%4095+1; sxSent[sxId]=cmd===0x7F&&payload&&payload.length?payload[0]:'cmd '+hx([cmd]); return {id:sxId,bytes:[0xF0,0x00,0x20,0x76,0x19,0x40,0x60|((sxId>>7)&0x1F),sxId&0x7F,cmd,...pack7(payload||[]),0xF7]}; }
function sxMsg(op){ return sxReq(0x7F,[op]).bytes; }
function sxParse(d){ if(d[0]!==0xF0||d.length<9||d[1]!==0||d[2]!==0x20||d[3]!==0x76) return null; if(d[5]===0x33) return {debug:true,text:asc(d.slice(6,-1))}; if(d[4]!==0x19||d[5]!==0x40) return null;
  // flags: 0x60 a request (ours), 0x40 a notice from the TP-7, 0x20 its reply (build 1 read requests as notices, so the log showed garbage)
  const fl=d[6], id=((fl&0x1F)<<7)|d[7], cmd=d[8], kd=fl&0x60; if(kd===0x60) return {kind:'req',id,cmd,v:sx7(d.slice(9,-1))}; if(kd===0x40) return {kind:'event',id,cmd,v:sx7(d.slice(9,-1))};
  const st=d[9]??0, v=sx7(d.slice(10,-1)); return {kind:'resp',id,cmd,st,v,reason:st?asc(v):''}; }
function sxText(d){ const p=sxParse(d); if(!p) return hx(d); if(p.debug) return 'debug: '+p.text;
  if(p.kind==='req'){ if(p.cmd===0x01) return `Greet #${p.id}`; if(p.cmd!==0x7F) return `command ${hx([p.cmd])} #${p.id}`; const op=p.v[0], val=p.v[1];
    return `${op===0x09?`Select track ${val+1}`:op===0x0a?`Set input ${inName(val)}`:SXN[op]||'op '+hx([op])} #${p.id}`; }
  const kv=v=>{ if(!v.length) return ''; const k=v[0], x=v[1]; return k===0x09?`, track ${x===0xff?'none (normal mode)':x+1}`:k===0x0a?`, input ${inName(x)}`:`, ${String.fromCharCode(k)} = ${v.slice(1).join(' ')}`; };
  if(p.kind==='resp') return p.cmd===0x01?`greet reply: ${asc(p.v)}`:`reply to ${SXN[sxSent[p.id]]||sxSent[p.id]} #${p.id}: status ${p.st}${kv(p.v)}`;
  const v=p.v; if(p.cmd!==0x7F) return 'event '+hx(v.slice(0,12));
  if(v[0]===0x4D&&v.length>=5) return `position ${u32le(v,1)} ms`; if(v[0]===0x4F) return `armed = ${v[1]}`; if(v[0]===0x4E) return `playing = ${v[1]}`; if(v[0]===0x4B) return `file: ${(sxFile(d)||{}).path||'?'}`;
  return `notice ${String.fromCharCode(v[0])} = ${v.slice(1).join(' ')}`; }
function sxFile(d){ const p=sxParse(d); if(!p||p.kind!=='event'||p.cmd!==0x7F) return null; const v=p.v; if(v[0]!==0x4B||v.length<17) return null; const parts=[]; let t='';
  for(let i=16;i<v.length;i++){ if(v[i]===0){ if(t) parts.push(t); t=''; } else t+=String.fromCharCode(v[i]); } if(t) parts.push(t); return {path:parts.join('/'),sr:u32le(v,1),frames:u32le(v,5),b9:v[9]}; }
function sxLog(dir,d,t){ const L=TP.sxlog; if(!L) return; if(L.length>=600) return; const txt=d[0]===0xF0?sxText(d):(d[0]&0xF0)===0xB0?`CC ${d[1]} = ${d[2]}${(d[0]&15)?' ch '+((d[0]&15)+1):''}`:(d[0]&0xF0)===0x90?`note ${d[1]} on`:hx(d);
  const last=L[L.length-1], pm=/^position (\d+) ms$/.exec(txt); if(pm&&dir==='in'&&last&&last.run){ last.n++; last.s=`in  position ${last.first} → ${pm[1]} ms (${last.n})`; return; }
  L.push(pm&&dir==='in'?{t:Math.round(t),s:'in  '+txt,run:true,first:pm[1],n:1}:{t:Math.round(t),s:(dir==='in'?'in  ':'out ')+txt}); }

// the TP-7's own reports: position (M) every ~200 ms while the tape moves, armed (O), playing (N), file (K)
const TP={pos:null,posLog:[],arm:null,play:null,file:null,info:null,listeners:new Set(),sxlog:null,held:null};
function midiIn(ev,port){ const d=[...ev.data], now=evT(ev);
  if(/tp.?7/i.test(port)&&!/blue/i.test(port)&&d[0]===0xF0){ sxLog('in',d,now); TP.listeners.forEach(f=>{ try{ f(d,now); }catch(e){} });
    const p=sxParse(d); if(!p) return; if(p.debug){ log('err','TP-7 debug frame: '+p.text); return; }
    if(p.kind==='event'&&p.cmd===0x7F){ const v=p.v;
      if(v[0]===0x4D&&v.length>=5){ TP.pos=u32le(v,1); TP.posLog.push([now,TP.pos]); if(TP.posLog.length>3000) TP.posLog.splice(0,1500); }
      else if(v[0]===0x4F){ const o=TP.arm; TP.arm={v:v[1],t:now}; if(!o||o.v!==v[1]) log('tp',`armed = ${v[1]}`); }
      else if(v[0]===0x4E){ const o=TP.play; TP.play={v:v[1],t:now}; if(!o||o.v!==v[1]) log('tp',`playing = ${v[1]}`); }
      else if(v[0]===0x4B){ TP.file=sxFile(d); } }
    if(p.kind==='resp'&&p.cmd===0x01){ const o={}; asc(p.v).split(';').forEach(kv=>{ const i=kv.indexOf(':'); if(i>0) o[kv.slice(0,i).replace(/^[^a-z]+/i,'')]=kv.slice(i+1); }); if(o.product) TP.info=o; }
    return; }
  if(port&&!/tp.?7/i.test(port)) PED.midi&&PED.midi(d,port); }
async function sxAsk(cmd,payload,ms){ const q=sxReq(cmd,payload); let got=null; const f=d=>{ const p=sxParse(d); if(p&&p.kind==='resp'&&p.id===q.id) got=p; };
  TP.listeners.add(f); mNow(q.bytes); await waitFor(()=>!!got,ms||400,5); TP.listeners.delete(f); return got; }
async function sxAlive(){ const r=await sxAsk(0x01,[],900); return r?(/mode:([a-z_]+)/i.exec(asc(r.v))||[])[1]||'?':null; }
async function tpRead(op){ const r=await sxAsk(0x7F,[op],500); return r&&!r.st&&r.v.length>=2?r.v[1]:null; }
const tpEditRead=()=>tpRead(0x0b); // ff = not in edit mode, otherwise the selected track (25 Oct)
async function tpSetEdit(on){ const v=await tpEditRead(); if(v!=null&&(v!==0xff)===on) return {sent:false,after:v};
  mNow([0xB0,14,0]); mNow(sxMsg(SXOP.edit)); await sleep(700); return {sent:true,after:await tpEditRead()}; }
async function tpSel(track,input){ const a=await sxAsk(0x7F,[0x09,track],400); if(!(a&&!a.st)) return false; const b=await sxAsk(0x7F,[0x0a,input],400); if(!(b&&!b.st)) return false; TP.trk=track; TP.inp=input; return true; }
// track first, input once the track took (31 Oct: a refused track change put the input on the wrong track); wait for armed = 0 first
async function tpSelSafe(track,input){ if(TP.arm&&TP.arm.v===1){ TP.perf=false; mNow([0xB0,14,0]); } await waitFor(()=>!TP.arm||TP.arm.v===0,600,10);
  for(let i=0;i<4;i++){ if(await tpSel(track,input)){ const t=await tpRead(0x0b), n=await tpRead(0x0c); if(t===track&&n===input) return true; } await sleep(150); }
  log('err',`the TP-7 did not take track ${track+1}, ${inName(input)}`); return false; }
async function tpEditTo(track,input){ const ed=await tpSetEdit(true); if(ed.after==null) return 'The TP-7 does not answer.'; if(ed.after===0xff) return 'Edit mode did not come on.';
  return (await tpSelSafe(track,input))?'':`The TP-7 did not take track ${track+1}, ${inName(input)}.`; }
async function tpPosNow(){ TP.pos=null; mNow(sxMsg(SXOP.session)); await sleep(300); return TP.pos==null?0:TP.pos; }
async function tpFileNow(){ TP.file=null; mNow(sxMsg(SXOP.session)); await waitFor(()=>!!TP.file,1500); return TP.file; }
// back to the start: 0x4a (24 Oct: also in edit mode, where stop does not rewind; 18 of 18), checked by the position it reports
async function tpToStart(){ mNow([0xB0,14,0]); mNow(sxMsg(SXOP.stop)); await sleep(250); TP.pos=null; mNow(sxMsg(SXOP.start)); if(await waitFor(()=>TP.pos===0,500,10)) return true;
  await sleep(150); if((await tpPosNow())<=150) return true; mNow(sxMsg(SXOP.start)); await sleep(500); return (await tpPosNow())<=150; }
async function tpArm(on){ mNow([0xB0,14,on?127:0]); return waitFor(()=>TP.arm&&TP.arm.v===(on?1:0),600,10); }
async function tpAlive(){ if(R.sysex!==true) return false; if(await sxAlive()) return true; await midiConnect(); await sleep(900); return !!(await sxAlive()); }
function tpProblem(){ if(!midiReady()) return 'Connect the TP-7 first (Settings, Connect).'; if(R.sysex!==true) return 'SysEx is not allowed: reconnect and allow SysEx.'; return ''; }
const fileTxt=f=>f?`${f.path.split('/').pop()} (${(f.frames/Math.max(1,f.sr)).toFixed(2)} s, ${f.b9} track${f.b9===1?'':'s'})`:'unknown';
// a cue note: tap it (it jumps and plays while held), then stop, so the tape waits on the cue (24 Oct test 10 C)
async function tpCue(n){ mNow([0xB0,17,0]); mNow([0x90,n,100]); await sleep(90); mNow([0x80,n,0]); await sleep(150); mNow(sxMsg(SXOP.stop)); await sleep(350); }
// the performance stance: the tape standing, armed, so the guitar reaches the app (8 Oct) and nothing records.
// Build 1 used edit mode on track 1, line 1: you heard your guitar, the app heard it, but you did not hear the app (8 Nov, test 1).
// Normal mode, armed with record sources line 1, USB 1 and USB 2 should give both: the guitar reached the app while armed in normal
// mode (8 Oct), and you heard Tinebox while recording line 1 (build 42 test 15). Test 1 checks it; S.tp.stance keeps what it found.
// Never Play in this stance: in normal mode that makes a new recording (printing checks the loaded file first).
async function tpPerform(){ const e=tpProblem(); if(e) return e; tpRelease(); mNow([0xB0,17,0]); mNow(sxMsg(SXOP.stop)); await sleep(120);
  if(S.tp.stance==='edit'){ const r=await tpEditTo(0,TPIN.line1); if(r) return r; }
  else { const ed=await tpSetEdit(false); if(ed.after==null) return 'The TP-7 does not answer.'; if(ed.after!==0xff) return 'Edit mode did not go off.'; }
  if(!(await tpArm(true))) return 'The TP-7 did not report armed.'; TP.perf=true; TP.stance=S.tp.stance; return ''; }
// a cue note held for TP-7 playback (Sections) is let go before anything else
function tpRelease(){ if(TP.held!=null){ mNow([0x80,TP.held,0]); TP.held=null; } }
async function tpUnperform(){ TP.perf=false; if(TP.arm&&TP.arm.v===0) return true; return tpArm(false); }

// ================================================================== the looper (in the app)
// S.ses: {id, bpm, file, fileEnd, cues:{note:tape s}, secs:[{id,name,bars,L,s,layers:[{id,type,state,printed,gain,muted,preset,oct}]}], cur, rt}
// E.st: idle, prep, ready (session ready, nothing yet), first (a section's first pass), loop, stopped, printing, tape (TP-7 playback)
const E={st:'idle',msg:'',small:'',play:null,next:null,rec:null,gen:0,ci:null,bufs:new Map(),raws:new Map(),busy:false};
// The first section starts 0.25 s into the TP-7 recording (build 1 and 2: 2 s, a lead-in for the print passes; 8 Nov: "the loops are
// significantly delayed (seconds) when playing on the TP-7"). 0.25 s keeps it clear of the tape's slow start (motor on). 32 bars at most.
const TAPE0=0.25, CAP=32;
const uid=()=>Math.random().toString(36).slice(2,10);
const SES=()=>S.ses, SEC=k=>S.ses&&S.ses.secs[k];
const barS=()=>240/(S.ses?S.ses.bpm:100), beatS=()=>60/(S.ses?S.ses.bpm:100);
const TRACK={gtr:0,syn:1,drm:2}, TNAME={gtr:'Guitar',syn:'Synth',drm:'Drums'};
function say(m,small){ if(m!=null&&m!==E.msg) log('say',m); if(m!=null) E.msg=m; if(small!=null) E.small=small; renderScreen(); }
const sleepTo=t=>sleep(Math.max(0,(t-ctx.currentTime)*1000));
const at=(t,f)=>setTimeout(f,Math.max(0,(t-ctx.currentTime)*1000));

// ------------------------------------------------------------------ the clock and the metronome
const CLK={on:false,z0:0,n:0,clicks:[]};
function clkStart(z){ const b=beatS(); CLK.z0=z; CLK.n=Math.ceil((ctx.currentTime+0.02-z)/b-1e-6); clkClear(z-0.02); CLK.on=true; }
function clkStop(){ CLK.on=false; clkClear(ctx?ctx.currentTime:0); }
function clkClear(after){ CLK.clicks=CLK.clicks.filter(c=>{ if(c.t>after){ c.g.forEach(g=>{ try{ g.disconnect(); }catch(e){} }); return false; } return c.t>ctx.currentTime-0.3; }); }
const clkNext=t=>{ const b=barS(); return CLK.z0+Math.ceil((t-CLK.z0)/b-1e-6)*b; };
const clkNear=t=>{ const b=barS(); return CLK.z0+Math.round((t-CLK.z0)/b)*b; };
function tick(){ if(!ctx||ctx.state!=='running') return; const now=ctx.currentTime, ahead=now+0.15, b=beatS();
  if(CLK.on&&S.ses){ for(;;){ const t=CLK.z0+CLK.n*b; if(t>ahead) break; if(t>=now+0.005&&S.metroOn&&!inCount(t)) CLK.clicks.push({t,g:knock(t,((CLK.n%4)+4)%4===0)}); CLK.n++; } }
  // a drum take replays what it has so far, from the next time round
  const r=E.rec, P=E.play; if(r&&r.type==='drm'&&P){ for(const hh of r.hits){ for(;;){ const t=P.z+(hh.r+hh.n)*P.L+hh.ph; if(t>ahead) break; if(t>=now+0.005) drumV(ctx,A.pads,A.noise,DST,hh.i,t,hh.v,KITS[S.kit]); hh.n++; } } } }
// the count-in: the bar before z gets a beep on each beat still ahead in place of the knock, and a large count on screen
function countIn(z){ countOff(); const b=beatS(), c=E.ci={a:z-4*b,b:z,beat:b,g:[]}; clkClear(c.a-0.01);
  for(let i=0;i<4;i++){ const t=z-(4-i)*b; if(t<ctx.currentTime+0.03) continue; c.g.push(beep(t,i+1)); }
  // knocks already scheduled after the count-in bar must come back: let the clock reschedule from there
  CLK.n=Math.min(CLK.n,Math.ceil((z-CLK.z0)/b-1e-6)); }
function countOff(){ const c=E.ci; if(!c) return; c.g.forEach(g=>{ try{ g.disconnect(); }catch(e){} }); E.ci=null; }
const inCount=t=>{ const c=E.ci; return !!(c&&t>=c.a-0.01&&t<c.b-0.01); };

// ------------------------------------------------------------------ loop playback: one looping source per layer
function mkBuf(y,N){ const b=ctx.createBuffer(1,N,ctx.sampleRate), d=b.getChannelData(0); d.set(y.length>N?y.subarray(0,N):y); return b; }
function phase(t,z,L){ return ((t-z)%L+L)%L; }
function srcAdd(P,id,s){ const a=P.srcs.get(id)||[]; a.push(s); P.srcs.set(id,a); }
function gainOf(l){ return l.muted?0:(l.gain==null?1:l.gain); }
// a looping source for layer l in loop P from time t (at the right phase)
function layerPlay(P,l,t){ const buf=E.bufs.get(l.id); if(!buf||!P) return; t=Math.max(t,ctx.currentTime+0.02);
  const src=ctx.createBufferSource(), g=ctx.createGain(); src.buffer=buf; src.loop=true; src.loopStart=0; src.loopEnd=buf.duration; g.gain.value=gainOf(l); src.connect(g); g.connect(A.loop);
  src.start(t,phase(t,P.z,P.L)*buf.duration/P.L); srcAdd(P,l.id,{src,g,loop:true}); }
// round 1 of a fresh loop: buffer part [p0, p1) of the loop (in seconds), played once at its place in the round starting at z
function layerOnce(P,id,buf,p0,p1,z){ const now=ctx.currentTime+0.02; let t=z+p0, off=p0; if(t<now){ off+=now-t; t=now; } if(off>=p1) return;
  const src=ctx.createBufferSource(), g=ctx.createGain(); src.buffer=buf; src.connect(g); g.connect(A.loop); src.start(t,off,p1-off); srcAdd(P,id,{src,g}); }
function layerSilence(P,id,t,fade){ const a=P&&P.srcs.get(id); if(!a) return; t=Math.max(t,ctx.currentTime);
  a.forEach(s=>{ try{ s.g.gain.cancelScheduledValues(t); s.g.gain.setValueAtTime(s.g.gain.value,t); s.g.gain.linearRampToValueAtTime(0,t+(fade||0.01)); s.src.stop(t+(fade||0.01)+0.01); }catch(e){} }); P.srcs.delete(id); }
function loopStart(k,z){ const sec=SEC(k), P={k,z,L:sec.L,srcs:new Map()}; sec.layers.forEach(l=>layerPlay(P,l,z)); return P; }
function loopEnd(P,t){ if(!P) return; [...P.srcs.keys()].forEach(id=>layerSilence(P,id,t,0.012)); }
function layerGain(l){ const P=E.play; if(P&&P.srcs.get(l.id)) P.srcs.get(l.id).forEach(s=>{ try{ s.g.gain.setTargetAtTime(gainOf(l),ctx.currentTime,0.01); }catch(e){} }); }
async function ensureBufs(k){ const sec=SEC(k); if(!sec) return; for(const l of sec.layers){ if(E.bufs.get(l.id)) continue; const d=await IDB.get(S.ses.id+':'+l.id);
    if(d&&d.y){ const b=ctx.createBuffer(1,d.y.length,d.sr||ctx.sampleRate); b.getChannelData(0).set(d.y); E.bufs.set(l.id,b); } else log('err',`layer ${l.id}: no audio stored`); } }
function storeLayer(l,y,sr){ IDB.put(S.ses.id+':'+l.id,{y,sr}); }

// ------------------------------------------------------------------ a session: a new TP-7 recording, the performance stance, the round trip
async function prepSession(bpm,tapZ){ const e=tpProblem(); if(e){ say(e); return; } initAudio(); if(!ctx) return;
  if(['prep','printing'].includes(E.st)) return; await stopAll(true); E.st='prep'; const G0=++E.gen; say(`New session at ${Math.round(bpm)} bpm: checking the TP-7…`,'');
  const gone=()=>G0!==E.gen, fail=m=>{ if(!gone()){ E.st=S.ses&&S.ses.secs.length?'stopped':'idle'; say(m); } log('err',m); return m; };
  if(!(await tpAlive())) return fail('The TP-7 does not answer over MIDI. Check the cable, then Settings, Connect.');
  if(!(await openInput())) return fail('No audio input: the app cannot hear the guitar.');
  say(`New session at ${Math.round(bpm)} bpm: making a new TP-7 recording…`);
  // 1. half a second in normal mode with the app silent: a new recording with one track per record source (line 1, USB 1, USB 2)
  await tpUnperform(); await tpSetEdit(false); if(gone()) return; if(!(await tpToStart())) return fail('The tape did not go back to the start.');
  // 1.3 s, so the position reports also give the TP-7's start lag (normal mode, armed, Start Session 0.25 s ahead, Play)
  A.master.gain.value=0; let T=ctx.currentTime+0.5; const Pp=audioToPerf(T)+midiOffset(); midiSend([0xB0,14,127],T-0.35); midiSend(sxMsg(SXOP.session),T-0.25); midiSend(sxMsg(SXOP.play),T); midiSend(sxMsg(SXOP.stop),T+1.3); midiSend([0xB0,14,0],T+1.35);
  await sleepTo(T+1.5); A.master.gain.value=1; const lf=posFit(Pp-50,0); if(lf.n>=3){ (S.tp.lag=S.tp.lag||{}).normal=Math.round(lf.c-Pp); log('st',`start lag (normal mode): ${S.tp.lag.normal} ms`); }
  await sleep(400); if(gone()) return; const f=await tpFileNow(); if(gone()) return;
  // 2. that half second recorded the guitar on track 1 too: wipe it (input erase, armed over the first second)

const clkFirst=()=>ctx.currentTime+0.1;
// clicks out through USB 1, back through the TP-7's track 1 monitor: graph time out → graph time in

// ------------------------------------------------------------------ the first pass of a section: from the bar line nearest the press
function firstStart(type,S0,via){ E.rec={type,first:true,S0,via:via||null,hits:type==='drm'?[]:null}; E.st='first'; E.play=null; if(type==='syn') preview(true);

function newLayer(type){ return {id:uid(),type,state:S.autoAccept?'accepted':'pending',printed:false,gain:type==='syn'?S.synth.level:1,muted:false,preset:type==='syn'?S.synth.preset:null,oct:type==='syn'?S.synth.oct:0,glide:!!S.synth.glide,snap:!!S.synth.snap,created:Date.now()}; }
// switch 2 in the first bar of a first pass: a false start, nothing kept
function firstCancel(){ E.cancelled=true; clearTimeout(E.capT); E.rec=null; preview(false); E.st=S.ses.secs.length?'stopped':'ready'; if(E.st==='stopped') clkStop(); say('Cancelled: nothing kept.',''); renderAll(); }

// ------------------------------------------------------------------ layers while a section loops: tap on, tap off
function layerStart(type,h){ const P=E.play; if(!P) return; E.rec={type,first:false,h0:h,k:P.k,z:P.z,L:P.L,hits:type==='drm'?[]:null};
  if(type==='syn') preview(true); say(type==='drm'?'Recording drums: play the pads. Rec again stops.':type==='syn'?'Recording a synth layer… switch 5 again stops it.':'Recording a guitar layer… switch 1 again stops it.',''); renderAll(); }
async function layerStop(h,quiet){ const r=E.rec; if(!r||r.first) return; E.rec=null; preview(false); const sec=SEC(r.k), sr=ctx.sampleRate, N=Math.round(r.L*sr), l=newLayer(r.type);

  if(h-r.h0<0.15&&r.type!=='drm'){ if(!quiet) say('Too short: nothing kept.'); renderAll(); return; }
  l._busy=true; sec.layers.push(l); save(); renderAll(); log('st',`${TNAME[r.type]} layer on ${sec.name}: ${(h-r.h0).toFixed(2)} s`);

    fadeEdge(x,sr,pre,0.008); const off=Math.round(phase(r.h0-pre,r.z,r.L)*sr); y=G.fold(x,N,off); if(r.type==='syn'){ E.raws.set(l.id,{x,off,N}); IDB.put(S.ses.id+':'+l.id+':raw',{x,off,N,sr}); } }

// ------------------------------------------------------------------ synth layers: rendered from the guitar take in a worker
// The raw take plays until the synth is ready (a second or a few), then the synth takes over at once.
let SW=null; const SWQ=new Map();
function synthWorker(){ if(SW!==null) return SW; try{ const src=`${GDSP.toString()}\nconst G=GDSP();\nonmessage=e=>{ const d=e.data; let r; try{ const tr=G.transcribe(d.x,d.sr,{clean:true}); const y=G.render(tr,d.sr,d.x.length/d.sr+2.5,d.preset,{oct:d.oct,snap:d.snap,glide:d.glide}); const f=G.fold(y,d.N,d.off); const pk=G.peakOf(f), g=pk>0?0.4/pk:0; for(let i=0;i<f.length;i++) f[i]*=g; const k=G.keyOf(tr.notes); r={y:f,notes:tr.notes.length,key:k?k.tonic+':'+k.mode:null}; }catch(x){ r={err:String(x&&x.stack||x)}; } postMessage({id:d.id,r},r.y?[r.y.buffer]:[]); };`;
  SW=new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'}))); SW.onmessage=e=>{ const f=SWQ.get(e.data.id); if(f){ SWQ.delete(e.data.id); f(e.data.r); } }; }catch(e){ SW=false; } return SW; }
function synthRun(d){ return new Promise(res=>{ const w=synthWorker(), id=uid(); d.id=id;
  if(!w){ setTimeout(()=>{ try{ const tr=G.transcribe(d.x,d.sr,{clean:true}), y=G.render(tr,d.sr,d.x.length/d.sr+2.5,d.preset,{oct:d.oct,snap:d.snap,glide:d.glide}), f=G.fold(y,d.N,d.off), pk=G.peakOf(f); for(let i=0;i<f.length;i++) f[i]*=pk>0?0.4/pk:0; res({y:f,notes:tr.notes.length}); }catch(e){ res({err:String(e)}); } },10); return; }

async function synthLayer(l,k){ let raw=E.raws.get(l.id); if(!raw){ const d=await IDB.get(S.ses.id+':'+l.id+':raw'); if(d){ raw=d; E.raws.set(l.id,d); } } if(!raw) return;
  l._rendering=true; renderAll(); const t0=performance.now();

  l._rendering=false; if(r.err||!r.y){ log('err','synth render: '+(r.err||'nothing')); say('The synth could not be rendered: the raw take stays.'); renderAll(); return; }
  l.notes=r.notes; log('st',`synth ${l.preset}: ${r.notes} notes in ${Math.round(performance.now()-t0)} ms`);

  renderAll(); }

// ------------------------------------------------------------------ drums: what you play on the pads, as hits on the loop
function padHit(i,ev){ initAudio(); const now=ctx.currentTime; drumNow(i,now,0.9);
  if(PADCAL.on){ PADCAL.hits.push(p2h(evT(ev))); if(PADCAL.hits.length>=8) padCalDone(); return; }
  const r=E.rec; if(r&&r.type==='drm'&&r.first){ const h=p2h(evT(ev))-(S.padFix||0)/1000; if(h>=r.S0-0.05){ let t=h; if(S.quant){ const q=barS()/S.quant*4; t=r.S0+Math.round((h-r.S0)/q)*q; } r.hits.push({t,i,v:0.9}); } return; }
  if(r&&r.type==='drm'&&E.play){ const P=E.play, fix=(S.padFix||0)/1000, h=p2h(evT(ev))-fix; let ph=phase(h,P.z,P.L);
    if(S.quant){ const q=barS()/S.quant*4; ph=(Math.round(ph/q)*q)%P.L; } const rr=Math.floor((h-P.z)/P.L); r.hits.push({ph,i,v:0.9,r:rr,n:1}); } }
async function renderDrums(hits,L){ const sr=ctx.sampleRate, N=Math.round(L*sr), tail=Math.round(2*sr), OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const y=new Float32Array(N); if(!OAC) return y; const oc=new OAC(1,N+tail,sr), nb=oc.createBuffer(1,sr*2,sr), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const out=oc.createGain(); out.gain.value=S.lv.pads; out.connect(oc.destination); const st={}; hits.slice().sort((a,b)=>a.ph-b.ph).forEach(h=>drumV(oc,out,nb,st,h.i,h.ph,h.v,KITS[S.kit]||KITS.studio));
  const rb=await new Promise(res=>{ const p=oc.startRendering(); if(p&&p.then) p.then(res); else oc.oncomplete=e=>res(e.renderedBuffer); }), z=rb.getChannelData(0);
  for(let i=0;i<N;i++) y[i]=z[i]; for(let i=N;i<z.length;i++) y[(i-N)%N]+=z[i]; return y; }
// pad timing: tap any pad on 8 clicks; the median offset from the beat is the touch and output delay
const PADCAL={on:false,hits:[]};
function padCalStart(){ if(!CLK.on||!S.metroOn){ toast('Start a session or a loop with the metronome on first.'); return; } PADCAL.on=true; PADCAL.hits=[]; say('Pad timing: tap a pad on each of the next 8 clicks.'); renderAll(); }
function padCalDone(){ PADCAL.on=false; const b=beatS(), off=PADCAL.hits.map(h=>{ const n=Math.round((h-CLK.z0)/b); return h-(CLK.z0+n*b); }), m=medOf(off);

  S.padFix=Math.round(m*1000); save(); log('st',`pad timing: offsets ${off.map(v=>Math.round(v*1000)).join(', ')} ms → ${S.padFix} ms`);
  say(`Pad timing set: hits move ${S.padFix} ms earlier.`,`Your taps spread over ${Math.round(sp*1000)} ms.`); renderAll(); }

// ------------------------------------------------------------------ accept, dismiss
const pending=()=>{ const out=[]; (S.ses?S.ses.secs:[]).forEach((s,k)=>s.layers.forEach(l=>{ if(l.state==='pending') out.push({l,k}); })); return out; };
const toPrint=()=>{ const out=[]; (S.ses?S.ses.secs:[]).forEach((s,k)=>s.layers.forEach(l=>{ if(l.state==='accepted'&&!l.printed&&!l._busy&&!l.muted) out.push({l,k}); })); return out; };
function pendTxt(){ const p=pending().length, q=toPrint().length; return [p?`${p} layer${p>1?'s':''} to keep or drop (switch 6)`:'',q?`${q} to print when you stop`:''].filter(Boolean).join(' · '); }
function newestPending(){ const p=pending(); const cur=p.filter(x=>x.k===(S.ses?S.ses.cur:0)); const a=cur.length?cur:p; return a.sort((x,y)=>(y.l.created||0)-(x.l.created||0))[0]||null; }
function accept(x){ if(!x) return; x.l.state='accepted'; save(); log('st',`kept ${TNAME[x.l.type]} on ${SEC(x.k).name}`); say(`${TNAME[x.l.type]} layer kept.`,pendTxt()); renderAll(); }
function dismiss(x){ if(!x) return; const sec=SEC(x.k), l=x.l; layerSilence(E.play&&E.play.k===x.k?E.play:null,l.id,ctx.currentTime,0.03);
  sec.layers.splice(sec.layers.indexOf(l),1); E.bufs.delete(l.id); E.raws.delete(l.id); IDB.del(S.ses.id+':'+l.id); IDB.del(S.ses.id+':'+l.id+':raw');

    ses.secs.pop(); ses.cur=Math.max(0,ses.secs.length-1); say(`Section ${sec.name} dropped.`,pendTxt()); }
  else say(`${TNAME[l.type]} layer dropped.`,pendTxt()); save(); renderAll(); }

// ------------------------------------------------------------------ moving between sections: at the end of this time round, after a count-in
function nextWrap(P,min){ const now=ctx.currentTime; return P.z+Math.ceil((now+min-P.z)/P.L-1e-9)*P.L; }
async function goSection(k2,newSec){ const P=E.play; if(!P||E.next) return; const W=nextWrap(P,0.35); countIn(W);
  if(E.rec&&!E.rec.first) await layerStop(ctx.currentTime,true);
  loopEnd(P,W); const G0=E.gen;
  if(newSec){ E.next={W,newSec:true}; say('A new section starts at the end of this time round…','Rec on the Pads tab makes it a drum pass.'); at(W-0.01,()=>{ if(G0!==E.gen) return; E.next=null; const t=E.nextType||'gtr'; E.nextType=null; firstStart(t,W,t==='drm'?null:'next'); }); }
  else { await ensureBufs(k2); if(G0!==E.gen) return; const P2=loopStart(k2,W); E.next={W,k:k2}; S.ses.cur=k2; say(`Section ${SEC(k2).name} next…`);
    at(W-0.005,()=>{ if(G0!==E.gen) return; E.play=P2; E.next=null; say(`Section ${SEC(k2).name} is looping.`,pendTxt()); renderAll(); }); }
  renderAll(); }
// from a stop: a count-in bar, then section k loops (o.rec: start a layer of that type on its first beat; o.newSec: a first pass)
async function playFrom(k,o){ o=o||{}; const e=await perfReady(); if(e) say(e); const G0=++E.gen;
  if(!o.newSec) await ensureBufs(k); if(G0!==E.gen) return; await openInput();
  const bar=barS(), z=ctx.currentTime+0.35+bar; clkStart(z); countIn(z);
  if(o.newSec){ E.st='first'; E.next={W:z,newSec:true}; say('Count-in: a new section…'); at(z-0.01,()=>{ if(G0!==E.gen) return; E.next=null; const t=E.nextType||o.rec||'gtr'; E.nextType=null; firstStart(t,z,t==='drm'?null:'next'); }); renderAll(); return; }
  S.ses.cur=k; const P=loopStart(k,z); E.play=P; E.st='loop'; say(`Count-in: section ${SEC(k).name}…`,pendTxt());
  if(o.rec) at(z-0.01,()=>{ if(G0!==E.gen||E.play!==P) return; layerStart(o.rec,z); }); else at(z,()=>{ if(G0===E.gen&&E.play===P) say(`Section ${SEC(k).name} is looping.`,pendTxt()); });
  renderAll(); }
// the TP-7 back in the performance stance after printing or tape playback
async function perfReady(){ if(TP.perf&&TP.stance===S.tp.stance&&TP.arm&&TP.arm.v===1) return ''; const e=tpProblem(); if(e) return e+' The app loops anyway, but cannot hear the guitar.'; return await tpPerform(); }
// stop: the loop and the metronome; a layer being recorded is kept (to keep or drop); the print follows if anything is kept
async function stopAll(quiet,h){ const now=ctx?ctx.currentTime:0; if(h==null) h=now;
  if(E.st==='first'&&E.rec){ if(h-E.rec.S0<barS()) firstCancel(); else { const r=E.rec; await firstClose(h,r.type,true); } }
  E.gen++; countOff(); clearTimeout(E.capT); E.next=null; E.nextType=null;

  if(E.play){ loopEnd(E.play,now); E.play=null; } clkStop(); preview(false);
  if(['loop','first','ready','stopped'].includes(E.st)) E.st=S.ses&&S.ses.secs.length?'stopped':(S.ses?'ready':'idle');
  if(E.st==='ready') clkStart(clkFirst());
  if(!quiet){ say(E.cancelled?'Cancelled: nothing kept.':'Stopped.',pendTxt()); if(S.printOnStop&&toPrint().length) printSoon(); } E.cancelled=false; renderAll(); }

// ================================================================== the TP-7 as the tape
// Printing: one straight pass per section and track, with the sum of that track's kept layers. No TP-7 loop points are ever set
// while armed (every freeze so far came from those, 25 to 31 Oct). The pass is timed by the TP-7's own position reports (every
// ~200 ms while the tape moves), so the start lag (30 to 65 ms, different each session) does not matter. Silence around the section
// is printed too, which changes nothing in overdub, so the arm and disarm times are not critical.
// Cues: note k marks section k's start (0.4 s early, so its messages are done before the arm), note 64 + k a lead-in 1.5 s before it; set during playback only (CC 16 + note,
// 79 ms late), whenever a pass plays unarmed past where one is missing.
const CUE_PRE=0.4, LEAD=1.5;
let printT=null;
function printSoon(){ clearTimeout(printT); E.printAt=performance.now()+2500; say('Stopped. Printing the kept layers to the TP-7 in 2 s…','Switch 2 plays on instead; Sections has Print now.');
  printT=setTimeout(()=>{ E.printAt=null; if(E.st==='stopped') printAll(); },2500); }
function printCancelSoon(){ if(printT){ clearTimeout(printT); printT=null; E.printAt=null; } }
// The TP-7 reports its position in steps of 1/32 s, rounded down (8 Nov: 31, 93, 156, 218… ms), about every 200 ms. Build 1 took the
// median of (arrival − position) over 3 reports, which reads the tape up to 31 ms late (prints landed 20 ms after the reports, spread
// 17 ms). Each report bounds the offset c (arrival time of tape 0): c ≤ t − p (late arrival only lowers it) and c > t − p − 31.25.
// The tightest bounds over all reports give c to a few ms; if they disagree (a late report), the lowest t − p less half a step.
const QP=31.25;

  const c=lo<=hi?(lo+hi)/2:hi-QP/(p.length+1); return {n:p.length,c,lo,hi,width:lo<=hi?hi-lo:null,spread:Math.max(...d)-Math.min(...d)}; }
const posFit=(P0,q,from)=>fitOf(TP.posLog.filter(x=>x[0]>=P0&&x[1]>=q*1000+(from==null?350:from)&&x[1]<1e7));
const posFitQ=(P0,q)=>posFit(P0,q,150);
function cueBefore(t){ let best=null; const C=S.ses.cues||{}; for(const n in C){ const pos=C[n]; if(pos<=t&&(!best||pos>best.pos)) best={n:+n,pos}; } return best; }
// cues missing between tape times a and b (exclusive of armed spans), scheduled from the pass's fit
function cuesOnTheWay(a,b,tP,tag){ const ses=S.ses, md=S.tp.mDelay, set=[];
  ses.secs.forEach((sec,k)=>{ if(k>63) return; for(const [n,pos] of [[k,sec.s-CUE_PRE],[64+k,sec.s-LEAD]]){ if(pos<0.3||ses.cues[n]!=null||pos<a||pos>b) continue;
      const T=tP(pos)+md; if(T-40<performance.now()+15){ log('st',`cue ${n} skipped: its moment had passed`); continue; } midiSendPerf([0xB0,16,127],T-40,tag); midiSendPerf([0x90,n,100],T,tag); midiSendPerf([0xB0,16,0],T+120,tag); set.push([n,pos]); } });
  return set; }
function trackMix(job){ const sec=SEC(job.k), sr=ctx.sampleRate, N=Math.round(sec.L*sr), mix=ctx.createBuffer(1,N,sr), md=mix.getChannelData(0); let any=false;
  for(const l of job.layers){ const b=E.bufs.get(l.id); if(!b) continue; const d=b.getChannelData(0), g=gainOf(l), M=d.length; any=true;
    if(M===N) for(let i=0;i<N;i++) md[i]+=d[i]*g; else for(let i=0;i<N;i++){ const x=i*M/N, j=Math.floor(x), f=x-j; md[i]+=(d[j%M]*(1-f)+d[(j+1)%M]*f)*g; } }

async function printAll(){ const e=tpProblem(); if(e){ say(e); return; } if(!['stopped','ready'].includes(E.st)) return; printCancelSoon();
  const by={}; toPrint().forEach(({l,k})=>{ const key=k+':'+TRACK[l.type]; (by[key]=by[key]||{k,track:TRACK[l.type],layers:[]}).layers.push(l); });
  const jobs=Object.values(by).sort((a,b)=>a.k-b.k||a.track-b.track); if(!jobs.length){ say('Nothing kept to print.'); return; }
  const f=await tpFileNow(), mine=S.ses.file; if(f&&mine&&f.path!==mine.path){ say(`The TP-7 has another recording loaded (${f.path.split('/').pop()}): load ${mine.path.split('/').pop()} on the TP-7 to print this session.`); return; }
  E.st='printing'; E.printStop=false; const G0=++E.gen; A.mon.gain.setTargetAtTime(0,ctx.currentTime,0.01); renderAll(); let err='', done=0;
  // the input's delay can step (8 Nov: 63.5 ms in test 1, 74.1 ms in test 2 an hour later, after the live synth had run): measure it

    if(m.rt!=null){ S.ses.rt=m.rt; S.tp.rt[setupKey()]=m.rt; save(); const dd=(m.rt-was)*1000; log('st',`round trip before printing: ${msTxt(m.rt)} (was ${msTxt(was)})`);
      if(Math.abs(dd)>2) E.rtNote=`The input delay moved ${dd>0?'up':'down'} ${Math.abs(dd).toFixed(1)} ms since it was last measured: layers recorded after that may sit that much ${dd>0?'late':'early'}.`; } }
  // the first section's passes go by the start lag: measure it now, with the same start (track 1 armed from USB 1, the app silent)
  if(jobs.some(j=>SEC(j.k).s<1.3)){ say('Measuring the TP-7\'s start…'); const lg=await lagProbe(); if(lg==null) log('err','start lag not measured; the last one is used'); }
  for(const [i,job] of jobs.entries()){ if(E.printStop||G0!==E.gen) break; const sec=SEC(job.k);
    say(`Printing ${i+1} of ${jobs.length}: section ${sec.name}, ${['guitar','synth','drums'][job.track]} on track ${job.track+1}…`,'Switch 2: stop after this pass.');
    err=await printPass(job); if(err){ log('err','print: '+err); break; } done++; }
  A.mon.gain.setTargetAtTime(1,ctx.currentTime,0.02); const back=await tpPerform(); E.st='stopped';
  const left=toPrint().length; say(err?`Print stopped: ${err}`:left?`Printed ${done} pass${done===1?'':'es'}; ${left} layer${left>1?'s':''} still to print.`:`Printed: everything kept is on the TP-7.`,[back,E.rtNote,pendTxt()].filter(Boolean).join(' '));

// The same start for every pass: armed or not, Start Session 0.3 s ahead, then Play. For the first section (0.25 s into the
// recording) there is no room for the reports before it, so its passes go by the TP-7's start lag, measured just before (lagProbe)
// with this same start, and checked afterwards against the pass's own reports.
async function startPass(){ mNow(sxMsg(SXOP.session)); await sleep(300); const P0=performance.now(); mNow(sxMsg(SXOP.play)); return P0; }
async function lagProbe(){ if(await tpEditTo(0,TPIN.usb1)) return null; if(!(await tpToStart())) return null; if(!(await tpArm(true))) return null; const P0=await startPass();
  await waitFor(()=>posFit(P0,0).n>=5,3000,10); const f=posFit(P0,0); mNow([0xB0,14,0]); await sleep(60); mNow(sxMsg(SXOP.stop)); await waitFor(()=>TP.arm&&TP.arm.v===0,500,10); await sleep(250);
  if(f.n<3) return null; const lag=f.c-P0; (S.tp.lag=S.tp.lag||{}).edit=Math.round(lag*10)/10; save(); log('st',`start lag (edit mode, from the start): ${lag.toFixed(1)} ms, timing within ${f.width!=null?f.width.toFixed(1):'?'} ms`); return lag; }
async function printPass(job){ const ses=S.ses, sec=SEC(job.k); await ensureBufs(job.k); const mix=trackMix(job); if(!mix) return 'The layers have no audio.';
  await tpUnperform(); mNow([0xB0,17,0]); mNow(sxMsg(SXOP.stop)); await sleep(150);
  const r=await tpEditTo(job.track,TPIN.usb1); if(r) return r; const tag='print', end=ses.fileEnd||0;

  const cue=cueBefore(sec.s-1.3); let q2=0;
  if(cue){ await tpCue(cue.n); q2=(await tpPosNow())/1000; if(q2>sec.s-0.9){ log('err',`print: the tape stood at ${q2.toFixed(2)} s, too close to section ${sec.name}; from the start instead`); q2=0; if(!(await tpToStart())) return 'The tape did not go back to the start.'; } }
  else if(!(await tpToStart())) return 'The tape did not go back to the start.';
  const pred=sec.s-q2<1.3, lag=(S.tp.lag&&S.tp.lag.edit!=null)?S.tp.lag.edit:35;
  // playback stops at the end of the recording, so a section beyond it is armed before the end is reached; the first section always
  const armP=Math.min(sec.s-0.15,end-0.3), early=pred||armP<q2+0.45; if(early&&!(await tpArm(true))) return 'The TP-7 did not arm.';

  const g0=p2h(tP(sec.s)+(S.tp.printFix||0));
  if(g0<ctx.currentTime+0.04){ mNow([0xB0,14,0]); mNow(sxMsg(SXOP.stop)); return `Too little lead-in before section ${sec.name}.`; }
  const src=ctx.createBufferSource(); src.buffer=mix; src.connect(A.print); src.start(g0);
  if(!early) midiSendPerf([0xB0,14,127],tP(armP),tag);
  const cues=fit?cuesOnTheWay(q2+0.5,(early?q2:armP)-0.2,tP,tag):[];

  const offP=sec.s+sec.L+0.25; midiSendPerf([0xB0,14,0],tP(offP),tag); midiSendPerf(sxMsg(SXOP.stop),tP(offP+0.3),tag);
  await sleep(Math.max(0,tP(offP+0.6)-performance.now()));

  E.lastFit={n:fit?fit.n:0,width:fit?fit.width:null,pred,err,afterWidth:fa.width};
  log('st',`print ${sec.name} track ${job.track+1}: from ${q2.toFixed(2)} s, ${pred?`by the start lag (${lag.toFixed(1)} ms); the reports afterwards put it ${err==null?'?':(err>=0?'+':'')+err.toFixed(1)+' ms'} off (within ${fa.width!=null?fa.width.toFixed(1):'?'} ms)`:`${fit.n} reports (timing within ${fit.width!=null?fit.width.toFixed(1)+' ms':'? (reports disagree)'})`}${early?', armed from the start of the pass':''}`);
  cues.forEach(([n,pos])=>{ ses.cues[n]=pos; }); ses.fileEnd=Math.max(end,offP); job.layers.forEach(l=>{ l.printed=true; }); save(); return ''; }

// ------------------------------------------------------------------ TP-7 playback from a section (Sections view)
// Build 3: the quickest start. A cue note held down makes the TP-7 jump and play at once (14 Oct; build 2 went through edit mode, a
// cue tap, a stop and a position read first: about 2 s). The first section has no cue (it starts 0.25 s in): go to start, then Play.
// Loop points need the tape's timing before the section starts: from its reports when there is time, else from the start lag.
async function tapePlay(k,loop){ const e=tpProblem(); if(e){ say(e); return; } printCancelSoon(); if(E.st==='printing'){ toast('Printing: wait for it to finish.'); return; }

  tpRelease(); if(TP.arm&&TP.arm.v===1){ TP.perf=false; mNow([0xB0,14,0]); await waitFor(()=>TP.arm&&TP.arm.v===0,400,5); } mNow([0xB0,17,0]); if(G0!==E.gen) return;
  const C=S.ses.cues, lg=S.tp.lag||{}; let n=null, q=0, P0, lag;
  if(loop&&C[64+k]!=null){ n=64+k; q=C[n]; } else if(C[k]!=null){ n=k; q=C[k]; } else if(k>0){ const c=cueBefore(sec.s-(loop?1.2:0.3)); if(c){ n=c.n; q=c.pos; } }
  if(n!=null){ if(TP.play&&TP.play.v===1){ mNow(sxMsg(SXOP.stop)); await sleep(80); if(G0!==E.gen) return; } P0=performance.now(); mNow([0x90,n,100]); TP.held=n; lag=lg.cue!=null?lg.cue:60; }
  else { if(!TP.play||TP.play.v!==0){ mNow(sxMsg(SXOP.stop)); await sleep(200); } TP.pos=null; mNow(sxMsg(SXOP.start)); await waitFor(()=>TP.pos===0,500,5); if(G0!==E.gen) return; P0=performance.now(); mNow(sxMsg(SXOP.play)); lag=lg.play!=null?lg.play:35; q=0; }

  // where the tape is: the start lag at first, the reports once they come
  let tP=p=>P0+lag+(p-q)*1000;
  if(loop){ const md=S.tp.mDelay, adj=S.tp.loopAdj;
    await waitFor(()=>G0!==E.gen||posFit(P0,q).n>=3||tP(sec.s)+md-performance.now()<200,4000,10); if(G0!==E.gen) return; const f=posFit(P0,q); if(f.n>=3) tP=p=>f.c+p*1000;
    const tin=tP(sec.s)+md; if(tin<performance.now()+15){ log('err',`tape loop: section ${sec.name} began before the loop could be set`); say(`TP-7: playing section ${sec.name}; the loop could not be set in time.`); }
    else { midiSendPerf([0xB0,17,1],tin,'tape'); midiSendPerf([0xB0,17,2],tP(sec.s+sec.L)+md+adj,'tape'); } }

  E.tape.fit=fit; renderAll(); }
async function tapeStop(){ E.gen++; midiPurge('tape'); tpRelease(); mNow([0xB0,17,0]); mNow(sxMsg(SXOP.stop)); E.tape=null; E.st=S.ses&&S.ses.secs.length?'stopped':'idle'; say('TP-7 stopped.',''); renderAll(); }
// which section the tape is in now (from its last position report)
function tapeSecAt(pos){ const ses=S.ses; if(!ses) return -1; const t=pos/1000; for(let k=ses.secs.length-1;k>=0;k--) if(t>=ses.secs[k].s-0.05) return k; return -1; }

// ================================================================== actions: the footswitch and the on-screen switches share these
// Your layout (6 Nov): 1 guitar layer, 2 play/stop, 3 previous section, 4 next section (from the last one: a new section),
// 5 synth layer, 6 keep the newest layer (tap) or drop it (double tap); with nothing to keep, four taps of 6 start a new session.
const SW_ACT=['gtr','play','prev','next','syn','six'];
const SW_LABEL=[['Guitar','layer · close'],['Play / stop',''],['Previous','section'],['Next','section · new'],['Synth','layer · close'],['Keep','double tap: drop']];
async function act(a,ev,hh){ initAudio(); if(!ctx) return; if(ctx.state!=='running') try{ await ctx.resume(); }catch(e){}
  const h=hh!=null?hh:p2h(evT(ev)); log('do',`${a} (${E.st}${E.rec?', recording '+E.rec.type:''})`); requestWake();
  try{ await act2(a,h); }catch(err){ log('err',`${a}: ${err&&err.stack||err}`); say('Error: '+(err&&err.message||err)); } renderAll(); }
async function act2(a,h){ const st=E.st, ses=S.ses;

    if(st==='prep'){ say('Getting the TP-7 ready: press once the metronome runs.'); return; }
    if(st==='printing'){ E.printStop=true; E.after={play:true,rec:a}; say('Recording after this print pass…'); return; }
    if(st==='tape'){ await tapeStop(); return playFrom(ses.cur||0,{rec:a}); }
    if(st==='idle') return prepSession(ses?ses.bpm:(TAP.bpm||100));
    if(st==='ready'){ printCancelSoon(); await openInput(); if(!CLK.on) clkStart(clkFirst()); return firstStart(a,clkNear(h)); }
    if(st==='first'){ if(E.rec) return firstClose(h,a); return; }
    if(st==='loop'){ if(E.next){ say('Changing section: record once it starts.'); return; } if(E.rec){ const t=E.rec.type; await layerStop(h); if(t===a) return; } return layerStart(a,h); }
    if(st==='stopped'){ printCancelSoon(); return playFrom(ses.cur||0,{rec:a}); }
    return; }

  if(a==='drm'){ if(E.next&&E.next.newSec){ E.nextType=E.nextType==='drm'?null:'drm'; say(E.nextType?'The new section starts as drums: play the pads after the count-in.':'The new section starts as guitar.'); return; }
    if(st==='loop'&&!E.next){ if(E.rec&&E.rec.type==='drm') return layerStop(h); if(E.rec) await layerStop(h); return layerStart('drm',h); }
    if(st==='ready'){ printCancelSoon(); if(!CLK.on) clkStart(clkFirst()); return firstStart('drm',clkNear(h)); }
    if(st==='first'){ if(E.rec&&E.rec.type==='drm') return firstClose(h,'drm'); if(E.rec) return firstToDrums(); return; }
    if(st==='stopped'){ printCancelSoon(); return playFrom(ses.cur||0,{rec:'drm'}); }
    if(st==='idle') return prepSession(ses?ses.bpm:(TAP.bpm||100));
    toast('Wait a moment: the TP-7 is busy.'); return; }
  if(a==='play'){
    if(st==='ready'){ S.metroOn=!S.metroOn; save(); if(S.metroOn&&!CLK.on) clkStart(clkFirst()); say(`Metronome ${S.metroOn?'on':'off'}.`); return; }
    if(st==='first'||st==='loop') return stopAll(false,h);
    if(st==='stopped'){ printCancelSoon(); return playFrom(ses.cur||0); }
    if(st==='printing'){ E.printStop=true; E.after={play:true}; say('Playing after this print pass…'); return; }

    return; }
  if(a==='next'||a==='prev'){ if(!ses||!ses.secs.length) return; const n=ses.secs.length, cur=ses.cur||0;

    if(st==='stopped'){ printCancelSoon(); if(a==='next') return cur>=n-1?playFrom(cur,{newSec:true}):playFrom(cur+1); return playFrom(Math.max(0,cur-1)); }
    if(st==='tape'){ const k=clamp(cur+(a==='next'?1:-1),0,n-1); ses.cur=k; return tapePlay(k,E.tape&&E.tape.loop); }

// switch 6: with a layer to keep or drop, a tap keeps it and a double tap (within 0.35 s) drops it; otherwise tap tempo
const SIX={n:0,t:null};
function six(ev){ if(newestPending()){ SIX.n++; clearTimeout(SIX.t); if(SIX.n>=2){ SIX.n=0; act('drop',ev); return; } SIX.t=setTimeout(()=>{ SIX.n=0; act('keep'); },350); return; }
  if(SIX.n){ SIX.n=0; clearTimeout(SIX.t); } tapTempo(evT(ev)); }
const TAP={taps:[],bpm:null};
function tapTempo(ts){ initAudio(); const st=E.st; if(!['idle','stopped','ready'].includes(st)){ if(st==='loop') say('Nothing to keep or drop.'); return; }
  const T=TAP.taps; if(T.length&&ts-T[T.length-1]>2000) T.length=0; T.push(ts); log('in',`tap ${T.length}`);
  if(T.length<4){ say(`Tap ${4-T.length} more for a new session…`); return; }
  const iv=T.slice(1).map((t,i)=>t-T[i]), last=T[3]; T.length=0; const mx=Math.max(...iv), mn=Math.min(...iv);
  if(mx>1.25*mn){ log('st',`uneven taps: ${iv.map(Math.round).join(', ')} ms`); say('Uneven taps: tap 4 steady beats again.'); return; }
  const med=iv.slice().sort((a,b)=>a-b)[1], bpm=60000/med; if(bpm<50||bpm>200){ say(`${Math.round(bpm)} bpm is outside 50 to 200: tap again.`); return; }
  TAP.bpm=bpm; const z=p2h(last)+med/1000; // the beat after your fourth tap is bar 1
  if(st==='ready'&&S.ses&&!S.ses.secs.length){ S.ses.bpm=Math.round(bpm*10)/10; save(); clkStart(alignBar(z)); say(`Tempo ${S.ses.bpm} bpm.`); renderAll(); return; }
  prepSession(bpm,z); }
function alignBar(z){ const bar=barS(); return z<ctx.currentTime+0.05?z+Math.ceil((ctx.currentTime+0.05-z)/bar)*bar:z; }

// ------------------------------------------------------------------ the footswitch: AirTurn BT500S-6 in keyboard mode (mode 2)
// Switches 1 to 6 send Up, Down, Left, Right, Return, Space; every press arrives as a short tap (no holds in this mode, 29 Oct).
const PED_KEYS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '];
const PED={down:[0,0,0,0,0,0],up:[-1e9,-1e9,-1e9,-1e9,-1e9,-1e9],kd:[0,0,0,0,0,0],gate:null,midi:null};
const keyOf=e=>e.key==='Spacebar'?' ':e.key||({38:'ArrowUp',40:'ArrowDown',37:'ArrowLeft',39:'ArrowRight',13:'Enter',32:' '}[e.keyCode]||'');
const typing=t=>!!(t&&t.matches&&(t.matches('textarea,[contenteditable="true"]')||(t.matches('input')&&!/^(range|checkbox|radio|button)$/i.test(t.type||'text'))));
['keydown','keyup'].forEach(type=>window.addEventListener(type,e=>{ const i=PED_KEYS.indexOf(keyOf(e)); if(i<0||typing(e.target)) return;
  e.preventDefault(); e.stopImmediatePropagation(); const ae=document.activeElement; if(ae&&ae!==document.body&&ae.blur) ae.blur(); const now=performance.now();
  if(type==='keyup'){ PED.down[i]=0; PED.up[i]=now; swFlash(i,false); return; }
  if(e.repeat||(PED.down[i]&&now-PED.kd[i]<250)){ PED.kd[i]=now; return; }
  if(now-PED.up[i]<45){ log('in',`switch ${i+1}: bounce ignored`); return; }
  PED.down[i]=1; PED.kd[i]=now; setTimeout(()=>{ if(PED.down[i]&&performance.now()-PED.kd[i]>=120){ PED.down[i]=0; } },140);
  sw(i,e,'key'); },true));
function sw(i,ev,src){ log('in',`switch ${i+1}${src==='key'?'':' (screen)'}`); swFlash(i,true); setTimeout(()=>swFlash(i,false),160);
  if(PED.gate&&!PED.gate(i,ev)) return; if(i===5) return six(ev); act(SW_ACT[i],ev); }
function swFlash(i,on){ const b=document.querySelector(`[data-sw="${i}"]`); if(b) b.classList.toggle('flash',!!on); }
async function requestWake(){ try{ if('wakeLock' in navigator&&!E.wake) E.wake=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ E.wake=null; if(S.ses) requestWake(); if(ctx&&ctx.state!=='running') ctx.resume().catch(()=>{}); } });

function posTxt(){ if(!ctx) return '–'; const now=ctx.currentTime, b=beatS();
  if(E.ci&&now>=E.ci.a-0.01&&now<E.ci.b) return `in ${Math.min(4,Math.floor((now-E.ci.a)/b+0.02)+1)}`;
  if(E.st==='first'&&E.rec){ const t=now-E.rec.S0; if(t<0) return '–'; const n=Math.floor(t/b); return `${Math.floor(n/4)+1}·${n%4+1}`; }
  if(E.play){ const t=now-E.play.z; if(t<0) return '–'; const n=Math.floor(t/b), per=Math.round(E.play.L/b), m=n%per; return `${Math.floor(m/4)+1}·${m%4+1}`; }
  if(E.st==='tape'&&TP.pos!=null){ const s=TP.pos/1000; return `${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`; }
  if(CLK.on&&E.st==='ready'){ const n=Math.floor((now-CLK.z0)/b); return n>=0?`·${(n%4+4)%4+1}`:'–'; }
  return '–'; }
