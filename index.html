document.addEventListener('click',e=>{ const t=e.target.closest&&e.target.closest('[data-lset="snap"]'); if(!t) return; const k=+t.dataset.k, sec=SEC(k), l=sec&&sec.layers.find(x=>x.id===t.dataset.id); if(!l) return; l.snap=!l.snap; save(); synthLayer(l,k); renderAll(); });
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.synlv){ S.synth.level=+t.value; save(); return; }
  if(t.dataset.lg){ const sec=SEC(+t.dataset.k), l=sec&&sec.layers.find(x=>x.id===t.dataset.lg); if(!l) return; l.gain=+t.value; layerGain(l); save(); const v=document.querySelector(`[data-gv="l:${l.id}"]`); if(v) v.textContent=gTxt(l.gain); return; }
  if(t.dataset.tg){ const ty=t.dataset.tg; S.ses.tg=S.ses.tg||{gtr:1,syn:1,drm:1}; S.ses.tg[ty]=+t.value; S.ses.secs.forEach(sec=>sec.layers.forEach(l=>{ if(l.type===ty) layerGain(l); })); save(); const v=document.querySelector(`[data-gv="t:${ty}"]`); if(v) v.textContent=gTxt(S.ses.tg[ty]); return; }
  if(!t.dataset.lv) return; S.lv[t.dataset.lv]=+t.value; save(); if(ctx){ const n={metro:A.metro,loop:A.loop,pads:A.pads,prev:A.prev}[t.dataset.lv]; if(n) n.gain.setTargetAtTime(+t.value,ctx.currentTime,0.02); } });
function confirmTap(el,msg){ if(el._armed){ el._armed=false; return true; } el._armed=true; toast(msg); setTimeout(()=>{ el._armed=false; },3000); return false; }
async function copyText(txt,what){ try{ await navigator.clipboard.writeText(txt); toast(what+' copied. Paste it into our chat.'); }
  catch(e){ let ta=$('#copyTa'); if(!ta){ ta=document.createElement('textarea'); ta.id='copyTa'; ta.className='copy'; (($('#diag')&&!$('#diag').hidden)?$('#diag .wrap'):$('#pSet')).appendChild(ta); } ta.value=txt; ta.focus(); ta.select(); toast('Select the text below and copy it.'); } }


// ================================================================== diagnostics: what this design rests on, tested on your TP-7
const DG={run:null,res:{},sx:{}};
function diagOpen(){ let d=$('#diag'); if(!d){ d=document.createElement('div'); d.id='diag'; d.className='diag'; document.body.appendChild(d); } d.hidden=false; diagRender(); }
function diagClose(){ const d=$('#diag'); if(d) d.hidden=true; banner(''); }
const TESTS=[
  {id:'t1',name:'1. Hearing the app while you play',time:'about 2 minutes, your guitar',desc:'Build 1 found that with the TP-7 armed in edit mode you hear your guitar but not the app. This tries normal mode, armed (the new default), and edit mode only if normal mode fails: does your guitar reach the app, do you hear it, do you hear the app? Then the round trip and how the live synth feels. The stance that works is kept.'},
  {id:'t2',name:'2. Printing to the TP-7',time:'about 2 minutes, automatic',desc:'Makes a test session at 120 bpm (a new TP-7 recording), prints click layers in three passes onto track 1, then plays the recording back and listens: do the passes line up, where do they land, do the cues jump right, and does the TP-7 loop a section cleanly. Your current session ends.'},
  {id:'t3',name:'3. Your first loop, start to finish',time:'about 3 minutes, your guitar and footswitch',desc:'A real session with prompts: four taps for the tempo, a guitar loop, a synth layer, keep both, stop, the print, then the TP-7 plays it back. You say how each step sounded. Run it after test 1 has passed.'},
  {id:'t4',name:'4. Sending the song: per track or in one pass',time:'about 4 minutes, automatic, one hand step on the TP-7',desc:'Compares three ways to get a song onto the TP-7, with guitar on track 1, synth on track 2 and drums on track 3 (two layers each, two sections). A: the current way, one pass per section and track. C: synth and drums in one new recording (USB 1 and 2), then the guitar in one pass. B: all three tracks in one new recording, which needs the record sources set to USB 1, USB 2 and USB 3 for that run. For each: the time it takes and where every track lands, from the playback. Keep your guitar quiet. Your current session ends.'}];
function diagRender(){ const d=$('#diag'); if(!d||d.hidden) return;
  d.innerHTML=`<div class="wrap"><div class="row"><h2 style="flex:1">Diagnostics <small class="note">build ${APP_BUILD}</small></h2><button type="button" class="btn" data-dg="close">Close</button></div>
  <p class="note">Before you start: TP-7 connected by USB-C, Connect done in Settings, record sources line 1, USB 1 and USB 2, MIDI setting cue. The prompts show at the bottom of the screen; answer with the footswitch or the buttons that appear.</p>
  ${TESTS.map(t=>`<div class="card"><h3>${t.name}</h3><p class="note">${t.time}. ${t.desc}</p><div class="row"><button type="button" class="btn pri" data-dg="run" data-id="${t.id}" ${DG.run?'disabled':''}>${DG.run===t.id?'Running…':'Run'}</button>${DG.run===t.id?'<button type="button" class="btn" data-dg="stop">Stop</button>':''}</div>${DG.res[t.id]?`<div class="dgres">${esc(DG.res[t.id].join('\n'))}</div>`:''}</div>`).join('')}
  <div class="card"><div class="row"><button type="button" class="btn pri" data-dg="report">Copy report</button></div><p class="note">The report has every result, the TP-7's messages during each test and the log. Paste it into our chat.</p></div>
  <div id="dgAns" class="row"></div></div>`; }
document.addEventListener('click',async e=>{ const b=e.target.closest&&e.target.closest('[data-dg]'); if(!b) return; const a=b.dataset.dg;
  if(a==='close') return diagClose(); if(a==='report') return copyText(diagReport(),'Report');
  if(a==='stop'){ DG.stop=true; if(DG.ans) DG.ans(-1); return; }
  if(a==='ans'){ if(DG.ans) DG.ans(+b.dataset.v); return; }
  if(a==='run'&&!DG.run) runTest(b.dataset.id); });
function banner(main,sub,extra){ let el=$('#banner'); if(!main){ if(el) el.hidden=true; return; } if(!el){ el=document.createElement('div'); el.id='banner'; el.className='banner'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.hidden=false; el.innerHTML=`<b>${esc(main)}</b>${sub?`<span>${esc(sub)}</span>`:''}${extra?`<div class="bt">${esc(extra)}</div>`:''}`; }
// a question: answered by footswitch (switch n = option n) or by the buttons under the tests
function ask(main,opts){ banner(main,opts.map((o,i)=>`switch ${i+1}: ${o}`).join(' · ')); const box=$('#dgAns');
  if(box) box.innerHTML=opts.map((o,i)=>`<button type="button" class="btn" data-dg="ans" data-v="${i}">${i+1}. ${esc(o)}</button>`).join('');
  return new Promise(res=>{ DG.ans=v=>{ DG.ans=null; PED.gate=null; if(box) box.innerHTML=''; banner(''); res(v); }; PED.gate=(i)=>{ if(i<opts.length&&DG.ans) DG.ans(i); return false; }; }); }
const dgLine=(id,s)=>{ (DG.res[id]=DG.res[id]||[]).push(s); log('test',s); diagRender(); };
async function countdown(main,sub,sec){ for(let i=sec;i>0;i--){ if(DG.stop) return false; banner(main,sub,`${i}`); await sleep(1000); } banner(''); return !DG.stop; }
async function runTest(id){ DG.run=id; DG.stop=false; DG.res[id]=[]; DG.sx[id]=TP.sxlog=[]; diagRender(); log('app',`test ${id} started, build ${APP_BUILD}`);
  try{ await ({t1,t2,t3,t4})[id](); }catch(err){ dgLine(id,'✗ error: '+(err&&err.stack||err)); }
  TP.sxlog=null; DG.run=null; banner(''); PED.gate=null; DG.ans=null; diagRender(); }
async function dgBasics(id){ initAudio(); const e=tpProblem(); if(e){ dgLine(id,'✗ '+e); return false; }
  const m=await sxAlive(); if(!m){ dgLine(id,'✗ The TP-7 does not answer over SysEx.'); return false; }
  dgLine(id,`· TP-7 ${TP.info?TP.info.sw_version:'?'} (${m} mode); audio ${ctx.sampleRate} Hz, ${ctx.destination.maxChannelCount} output channels, base latency ${msTxt(ctx.baseLatency)}, output latency ${msTxt(ctx.outputLatency)}`);
  if(!(await openInput())){ dgLine(id,'✗ no audio input'); return false; } dgLine(id,`· audio input: ${IN.kind} (${IN.nch} channels)`); return true; }
// the input's peak over the next `sec` seconds
async function peakOver(sec){ let pk=0; const f=(t,x)=>{ for(let i=0;i<x.length;i++){ const a=Math.abs(x[i]); if(a>pk) pk=a; } }; IN.taps.add(f); await sleep(sec*1000); IN.taps.delete(f); return pk; }
const dB=v=>v>0?(20*Math.log10(v)).toFixed(1)+' dBFS':'silence';

// ------------------------------------------------------------------ test 1
const stName=st=>st==='edit'?'edit mode, track 1, line 1, armed':'normal mode, armed';
// eight clicks on one USB pair (0: USB 1, 1: USB 2, 2: USB 3). Pairs 2 and 3 need the output in discrete channels for a moment.
async function clicksOnPair(pair,n){ const d=ctx.destination, was={c:d.channelCount,i:d.channelInterpretation}; let mg=null;
  if(pair>0){ try{ d.channelCount=Math.min(6,d.maxChannelCount); d.channelInterpretation='discrete'; mg=ctx.createChannelMerger(6); mg.connect(d); }catch(e){ return false; } }
  const base=ctx.currentTime+0.4; for(let i=0;i<n;i++){ const t=base+i*0.5; if(!mg){ knock(t,i%4===0,A.test); continue; }
    const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=i%4===0?1500:1000; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.7,t+0.002); g.gain.exponentialRampToValueAtTime(0.001,t+0.09); o.connect(g); g.connect(mg,0,2*pair); g.connect(mg,0,2*pair+1); o.start(t); o.stop(t+0.1); }
  await sleepTo(base+n*0.5+0.2); if(mg){ try{ mg.disconnect(); d.channelCount=was.c; d.channelInterpretation=was.i; }catch(e){} } return true; }
async function stanceCheck(id,st){ S.tp.stance=st; const r=await tpPerform(); if(r){ dgLine(id,`✗ ${stName(st)}: ${r}`); return null; } dgLine(id,`· ${stName(st)}:`);
  const quiet=await peakOver(1); let lv=0; const f=(t,x)=>{ for(let i=0;i<x.length;i++){ const v=Math.abs(x[i]); if(v>lv) lv=v; } }; IN.taps.add(f);
  const ok=await countdown('Strum your guitar now','Big open chords, a few times.',5); IN.taps.delete(f); if(!ok) return null;
  dgLine(id,`  ${lv>0.01?'✓':'✗'} the app hears your guitar: peak ${dB(lv)} (before you played: ${dB(quiet)})`);
  const ag=await ask('Did you hear your guitar from the TP-7?',['yes','no']); if(ag<0) return null; dgLine(id,`  ${ag===0?'✓':'✗'} you hear your guitar: ${ag===0?'yes':'no'}`);
  banner('Listen, and do not play','Eight clicks from the app.'); const t0=ctx.currentTime; await clicksOnPair(0,8); await sleep(RT()*1000+100); banner('');
  let leak=0; const x=inSlice(t0+0.4+RT()-0.01,t0+0.4+4+RT()); if(x) for(const v of x) leak=Math.max(leak,Math.abs(v)); const qn=await peakOver(0.8);
  const lk=leak<Math.max(0.01,qn*3); if(st==='normal'){ S.tp.bleed=lk?0.005:Math.min(0.2,leak); save(); }
  dgLine(id,`  ${lk?'✓':'✗'} the app's clicks in the guitar input: ${dB(leak)} (quiet ${dB(qn)})${lk?'':'. The live synth now ignores this echo of itself; takes still carry the metronome this far down'}`);
  const aa=await ask('Did you hear eight clicks?',['yes','no']); if(aa<0) return null; dgLine(id,`  ${aa===0?'✓':'✗'} you hear the app: ${aa===0?'yes':'no'}`);
  return {app:lv>0.01,gtr:ag===0,heard:aa===0}; }
async function t1(){ const id='t1'; if(!(await dgBasics(id))) return; await stopAll(true);
  // the round trip (track 1 from USB 1, armed while standing), twice
  let r=await tpEditTo(0,TPIN.usb1); if(r){ dgLine(id,'✗ '+r); return; } await tpToStart(); await tpArm(true); const rts=[];
  for(let i=0;i<2&&!DG.stop;i++) rts.push(await measureRT()); await tpArm(false);
  rts.forEach((m,i)=>dgLine(id,m.rt!=null?`✓ round trip ${i+1}: ${msTxt(m.rt)} (clicks ${m.res.map(v=>(v*1000).toFixed(1)).join(', ')} ms)`:`✗ round trip ${i+1}: ${m.why}`));
  const good=rts.filter(m=>m.rt!=null).map(m=>m.rt); if(good.length){ S.tp.rt[setupKey()]=medOf(good); if(S.ses) S.ses.rt=medOf(good); save(); }
  if(DG.stop) return;
  // the stance: normal mode first; edit mode (build 1) only if normal mode fails, with clicks on USB 2 and USB 3 as well
  const was=S.tp.stance; let use=null; const a=await stanceCheck(id,'normal'); if(DG.stop) return;
  if(a&&a.app&&a.gtr&&a.heard) use='normal';
  else { const b=await stanceCheck(id,'edit'); if(DG.stop) return; if(b&&b.app&&b.gtr&&b.heard) use='edit';
    else if(b&&b.app&&ctx.destination.maxChannelCount>=6){ for(const pair of [1,2]){ banner('Listen, and do not play',`Eight clicks on USB ${pair+1}.`); await clicksOnPair(pair,8); banner('');
        const q=await ask(`Did you hear eight clicks (USB ${pair+1})?`,['yes','no']); dgLine(id,`  · clicks on USB ${pair+1} (outputs ${2*pair+1}–${2*pair+2}): ${q===0?'heard':'not heard'}`); if(q<0) return; } } }
  S.tp.stance=use||was||'normal'; save();
  dgLine(id,use?`✓ while you play, the TP-7 stands in ${stName(use)}`:'✗ no stance gave all three (guitar into the app, your guitar in your ears, the app in your ears)');
  if(!use) return;
  // the live synth
  r=await tpPerform(); if(r){ dgLine(id,'✗ '+r); return; } const pv=S.synth.preview; S.synth.preview=true; IN.loadMax=0; preview(true);
  dgLine(id,`· live synth (${G.PRESETS[S.synth.preset].name}): expected delay ${msTxt(RT()+0.03)} (round trip + about 30 ms of tracking)`);
  await countdown('Play single notes, then chords','The synth follows your guitar.',14); preview(false); S.synth.preview=pv;
  if(IN.loadMax) dgLine(id,`· the live synth used up to ${Math.round(IN.loadMax*100)} % of the audio thread`);
  const a3=await ask('How did the synth feel?',['playable','a bit late','too late','did not hear it']); dgLine(id,`· live synth: ${['playable','a bit late','too late','not heard'][a3]||'no answer'}`);
  const a4=await ask('Did it play the right notes?',['mostly right','some wrong','mostly wrong','did not hear it']); dgLine(id,`· live synth notes: ${['mostly right','some wrong','mostly wrong','not heard'][a4]||'no answer'}`);
  dgLine(id,'Done.'); }

// ------------------------------------------------------------------ test 2
function clickLayer(beats,f,L,off){ const sr=ctx.sampleRate, N=Math.round(L*sr), y=new Float32Array(N), b=beatS(), n=Math.round(0.004*sr);
  for(const k of beats){ const i0=Math.round((k*b+(off||0))*sr); for(let j=0;j<n&&i0+j<N;j++) y[i0+j]+=0.5*Math.sin(2*Math.PI*f*j/sr)*(j<n-24?1:(n-j)/24); } return y; }
// a click's pitch (1, 1.5 or 2 kHz in test 2): the strongest of the three by Goertzel over its 4 ms
function clickHz(t){ const x=inSlice(t-0.0005,t+0.0045); if(!x) return 0; let best=0, bf=0;
  for(const f of [1000,1500,2000]){ const w=2*Math.PI*f/IN.sr, c=2*Math.cos(w); let s1=0,s2=0; for(let i=0;i<x.length;i++){ const s0=x[i]+c*s1-s2; s2=s1; s1=s0; } const p=s1*s1+s2*s2-c*s1*s2; if(p>best){ best=p; bf=f; } } return bf; }
// click arrivals in the input over graph span [a, b)
function clicksIn(a,b){ const x=inSlice(a,b); if(!x) return []; const sr=IN.sr, out=[]; let fl=0; for(let i=0;i<Math.min(x.length,Math.round(0.05*sr));i++) fl=Math.max(fl,Math.abs(x[i]));
  const thr=Math.max(0.02,fl*5); for(let i=0;i<x.length;i++){ if(Math.abs(x[i])>thr){ out.push(a+i/sr); i+=Math.round(0.08*sr); } } return out; }

  const ses=S.ses, bar=barS(), L=2*bar, sr=ctx.sampleRate, mkSec=(k)=>({id:uid(),name:LETTERS[k],bars:2,L,s:TAPE0+k*L,layers:[]});

  for(const [k,beats,f] of defs){ const l=newLayer('gtr'); l.state='accepted'; const y=clickLayer(beats,f,L); E.bufs.set(l.id,mkBuf(y,Math.round(L*sr))); ses.secs[k].layers.push(l); lays.push({l,k,beats,f}); } save();

  E.st='stopped'; lays[1].l.state='pending'; lays[2].l.state='pending'; await printAll(); const f1=E.lastFit;
  lays[1].l.state='accepted'; await printAll(); const f2=E.lastFit; lays[2].l.state='accepted'; await printAll(); const f3=E.lastFit;
  // A starts 0.25 s in: its passes go by the start lag measured just before; the reports afterwards say how far off that was
  [f1,f2,f3].forEach((f,i)=>dgLine(id,!f?`✗ print pass ${i+1} did not run`:f.pred?`${f.err!=null&&Math.abs(f.err)<6?'✓':'✗'} print pass ${i+1} (section A, by the start lag): ${f.err==null?'not checked':`${(f.err>=0?'+':'')+f.err.toFixed(1)} ms off`} by its own reports (within ${f.afterWidth!=null?f.afterWidth.toFixed(1)+' ms':'?'})`:`· print pass ${i+1}: ${f.n} position reports, timing within ${f.width!=null?f.width.toFixed(1)+' ms':'? (the reports disagree)'}`));

  if(DG.stop) return;

  // a cue jump
  // the cue note plays while it is held (90 ms) and the stop takes a moment: the tape waits a little after the cue (8 Nov: 181 ms)
  const c=ses.cues[1]; if(c!=null){ await tpCue(1); const q=(await tpPosNow())/1000, d=q-c; dgLine(id,`${d>=-0.03&&d<=0.25?'✓':'✗'} cue for B: set for ${c.toFixed(3)} s, the tape stopped at ${q.toFixed(3)} s (${Math.round(d*1000)} ms after it; the held note plays briefly)`); } else dgLine(id,'✗ no cue for B was set');

  const g1=ctx.currentTime; await tapePlay(0,true); await sleep((L*3.4+1.5)*1000); await tapeStop(); const ts2=clicksIn(g1,ctx.currentTime-0.1);
  const cls=ts2.map(t=>({t,f:clickHz(t)})), b2=cls.filter(c=>c.f>1750).length; DG.dbg={cls,g1,ts,g0,fc:fit.c};
  dgLine(id,`${b2===0&&cls.length>=16?'✓':'✗'} TP-7 loop of A: ${cls.length} clicks heard, ${b2} of section B's (the loop held if none)`);
  if(cls.length) dgLine(id,`· TP-7 loop of A from the start of the recording: A's first click came back ${Math.round((cls[0].t-g1)*1000)} ms after the button (A starts 1.6 s in)`);
  // the same click one loop later: any later click of the same pitch about L later (build 1 counted clicks, and a click lost at the wrap broke the count)
  const iv=[]; cls.forEach((c,i)=>{ const n=cls.slice(i+1).find(x=>x.f===c.f&&Math.abs(x.t-c.t-L)<0.03); if(n) iv.push(n.t-c.t-L); });
  dgLine(id,iv.length?`${Math.abs(medOf(iv))<0.004?'✓':'✗'} TP-7 loop length: ${iv.length} repeats, the loop ${Math.abs(medOf(iv)*1000).toFixed(1)} ms ${medOf(iv)<0?'short':'long'} (loop out correction ${S.tp.loopAdj} ms)`:'✗ TP-7 loop length: no repeat measured');
  const per=cls.length?Math.round(cls.length/Math.max(1,(cls[cls.length-1].t-cls[0].t)/L)):0; dgLine(id,`· about ${per} of A's 8 clicks per time round heard${per<8?' (one lost at the wrap means the loop point cuts the first beat)':''}`);
  // ▶ TP-7 from B: held cue note, no stop or edit toggle (B's first click is on beat 2)
  if(!DG.stop&&ses.cues[1]!=null){ const g2=ctx.currentTime; await tapePlay(1,false); await sleep(2200); await tapeStop(); const c2=clicksIn(g2,ctx.currentTime-0.1).map(t=>({t,f:clickHz(t)})).find(c=>c.f>1750);
    dgLine(id,c2?`· ▶ TP-7 from B (its cue, ${(ses.secs[1].s-ses.cues[1]).toFixed(1)} s before it): B's start came back ${Math.round((c2.t-g2-beatS())*1000)} ms after the button, including the input delay (build 2: about 1.9 s)`:'✗ ▶ TP-7 from B: none of B\'s clicks came back'); }
  await perfReady(); dgLine(id,'Done. The test session stays loaded; tap switch 6 four times for a real one.'); }

// ------------------------------------------------------------------ test 4: sending the song, per track (A) or in one pass (C, B)
// The test song: sections A and B, 2 bars at 120 bpm; on every track two layers (beats 1, 3, 5, 7 and 2, 4, 6, 8), so each track has a
// click on every beat. The tracks differ in pitch (guitar 1 kHz, synth 1.5 kHz, drums 2 kHz) and sit 0, 125 and 250 ms after the beat,
// so one playback tells them apart even if the USB return mixes them.
const T4F={gtr:1000,syn:1500,drm:2000}, T4O={gtr:0,syn:0.125,drm:0.25}, T4N={gtr:'guitar (track 1)',syn:'synth (track 2)',drm:'drums (track 3)'};
function t4Song(){ const ses=S.ses, L=2*barS(), sr=ctx.sampleRate; ses.tg={gtr:1,syn:1,drm:1};
  ses.secs=[0,1].map(k=>({id:uid(),name:LETTERS[k],bars:2,L,s:TAPE0+k*L,bpm:ses.bpm,layers:[]}));
  for(const sec of ses.secs) for(const t of ['gtr','syn','drm']) for(const beats of [[0,2,4,6],[1,3,5,7]]){ const l=newLayer(t); l.state='accepted'; l.gain=1; const y=clickLayer(beats,T4F[t],L,T4O[t]);
    E.bufs.set(l.id,mkBuf(y,Math.round(L*sr))); l.env=envOf(y,160); if(t==='drm') l.hits=beats.map(b=>[b*beatS()+T4O[t],1,0.9]); sec.layers.push(l); }
  ses.cues={}; ses.cur=0; save(); renderAll(); return L; }
// one track's layers as a single buffer from section A's start, each section at its place (turned down as a whole if it would clip)
async function stemOf(t){ const secs=S.ses.secs; for(let k=0;k<secs.length;k++) await ensureBufs(k); const sr=ctx.sampleRate, s0=secs[0].s, end=secs.reduce((a,x)=>Math.max(a,x.s+x.L),0), N=Math.round((end-s0)*sr)+1, y=new Float32Array(N); let any=false;
  for(const sec of secs){ const o=Math.round((sec.s-s0)*sr), M=Math.round(sec.L*sr); for(const l of sec.layers){ if(l.type!==t||l.state!=='accepted') continue; const b=E.bufs.get(l.id); if(!b) continue; any=true; const d=b.getChannelData(0), g=gainOf(l), K=d.length;
      if(K===M) for(let i=0;i<M&&o+i<N;i++) y[o+i]+=d[i]*g; else for(let i=0;i<M&&o+i<N;i++) y[o+i]+=d[Math.min(K-1,Math.floor(i*K/M))]*g; } }
  let pk=0; for(let i=0;i<N;i++){ const a=y[i]<0?-y[i]:y[i]; if(a>pk) pk=a; } if(pk>0.78){ const g=0.78/pk; for(let i=0;i<N;i++) y[i]*=g; }
  return any?{t,y,pk,len:(N-1)/sr}:null; }
// the app's output as three USB pairs (USB 1 = channels 1-2, USB 2 = 3-4, USB 3 = 5-6), each stem on both channels of its pair
function multiOut(){ const d=ctx.destination; if(d.maxChannelCount<6) return null; const was={c:d.channelCount,i:d.channelInterpretation};
  try{ d.channelCount=6; d.channelInterpretation='discrete'; const mg=ctx.createChannelMerger(6); mg.connect(d); const g=[0,1,2].map(p=>{ const n=ctx.createGain(); n.connect(mg,0,2*p); n.connect(mg,0,2*p+1); return n; }); return {was,mg,g}; }catch(e){ log('err','6 outputs: '+(e&&e.message||e)); return null; } }
function multiOutEnd(o){ if(!o) return; try{ o.g.forEach(n=>n.disconnect()); o.mg.disconnect(); const d=ctx.destination; d.channelCount=o.was.c; d.channelInterpretation=o.was.i; }catch(e){} }
// C and B: a new TP-7 recording in normal mode, with stems on USB pairs (routes [[stem, pair]]), timed by the position reports before section A
async function sendOnePass(routes,lenS){ await tpUnperform(); mNow([0xB0,17,0]); mNow(sxMsg(SXOP.stop)); await sleep(150);
  const ed=await tpSetEdit(false); if(ed.after!==0xff) return {err:'Normal mode did not come on.'};
  const out=multiOut(); if(!out) return {err:'The phone gives the app fewer than 6 output channels.'};

    if(!(await waitFor(()=>posFit(P0,0).n>=3,4000,10))){ mNow(sxMsg(SXOP.stop)); mNow([0xB0,14,0]); return {err:'No position reports while recording.'}; }
    await waitFor(()=>{ const f=posFit(P0,0); return f.n>=8||f.c+TAPE0*1000-performance.now()<300; },3000,10);
    const fit=posFit(P0,0), tP=p=>fit.c+p*1000, g0=p2h(tP(TAPE0)+(S.tp.printFix||0)); if(g0<ctx.currentTime+0.04){ mNow(sxMsg(SXOP.stop)); mNow([0xB0,14,0]); return {err:'Too little lead-in before section A.'}; }

// C's second pass: one stem onto one track in edit mode from USB 1, from the start: an unarmed run-up for the reports, armed just before A

async function t4Play(track,lenS){ await tpUnperform(); await tpEditTo(track,TPIN.line1); await tpToStart(); const P0=performance.now(), g0=ctx.currentTime; mNow(sxMsg(SXOP.play));

    r=await sendOnePass([[st.gtr,0],[st.syn,1],[st.drm,2]],lenS); if(r.err) dgLine(id,'  ✗ '+r.err);
    else { const dB_=(performance.now()-t0)/1000; dgLine(id,`  ✓ sent in ${dB_.toFixed(1)} s; new recording: ${fileTxt(r.file)}, timing within ${r.fit.width!=null?r.fit.width.toFixed(1)+' ms':'?'} (${r.fit.n} reports)`);
      S.ses.file=r.file||S.ses.file; S.ses.fileEnd=TAPE0+lenS+0.25; S.ses.cues={}; const o=await t4Listen(id,lenS); sum.push(['B',dB_,o]); if(!o.gtr) dgLine(id,'  · no guitar on track 1: were the record sources USB 1, USB 2 and USB 3?'); } }
  else dgLine(id,'Run B skipped');
  if(a>=0) await ask('Set the record sources back to line 1, USB 1 and USB 2 (your guitar needs line 1 to reach the app)',['done']);
  // side by side
  dgLine(id,'Summary:'); for(const [n,d,o] of sum){ const sp=['syn','drm'].filter(t=>o[t]&&o.gtr).map(t=>`${t==='syn'?'synth':'drums'} ${((o[t].med-o.gtr.med)*1000).toFixed(1)} ms`).join(', ');
    dgLine(id,`  ${n}: ${d.toFixed(1)} s; guitar ${o.gtr?(o.gtr.med*1000).toFixed(1)+' ms':'?'} from the reports${sp?`; against the guitar: ${sp}`:''}${o.ear!=null&&o.ear>=0?`; by ear: ${['three clicks on every beat','some missing','uneven or doubled','not heard'][o.ear]}`:''}`); }
  dgLine(id,'  · A and C need no hand steps; B needs the record sources switched to USB 1 to 3 and back each time.');
  S.ses.secs.forEach(sec=>sec.layers.forEach(l=>{ l.printed=true; })); save(); await perfReady(); dgLine(id,'Done. The test session stays loaded; tap switch 6 four times for a real one.'); }

// ------------------------------------------------------------------ test 3: a real loop, start to finish, with your footswitch
async function stepWait(main,sub,fn,ms){ banner(main,sub); const ok=await waitFor(()=>DG.stop||fn(),ms||60000,50); banner(''); return ok&&!DG.stop; }
async function t3(){ const id='t3'; if(!(await dgBasics(id))) return; await stopAll(true); diagHide(true);
  try{
  if(!(await stepWait('Tap switch 6 four times','At a tempo you like. The TP-7 then gets ready (about 8 s).',()=>E.st==='prep',60000))) return;
  if(!(await stepWait('Getting the TP-7 ready…','',()=>E.st!=='prep',40000))) return; if(E.st!=='ready'){ dgLine(id,'✗ session: '+E.msg); return; }
  dgLine(id,`✓ session ready at ${S.ses.bpm} bpm, round trip ${msTxt(S.ses.rt)}, ${fileTxt(S.ses.file)}`);
  const hm=await ask('Do you hear the metronome?',['yes','no']); dgLine(id,`${hm===0?'✓':'✗'} metronome heard: ${hm===0?'yes':'no'}`); if(hm<0) return;
  if(!(await stepWait('Switch 1, then play two bars of chords','Switch 1 again at the end of the second bar.',()=>E.st==='loop'&&S.ses.secs.length===1,90000))) return;
  const A0=S.ses.secs[0]; await waitFor(()=>E.bufs.get(A0.layers[0]&&A0.layers[0].id),3000); const b0=E.bufs.get(A0.layers[0].id); let pk=0; if(b0) for(const v of b0.getChannelData(0)) pk=Math.max(pk,Math.abs(v));
  dgLine(id,`${pk>0.01?'✓':'✗'} section A: ${A0.bars} bar${A0.bars>1?'s':''} in ${A0.L.toFixed(2)} s, so ${bpmTxt(bpmOf(0))} bpm (you tapped ${bpmTxt(TAP.bpm||S.ses.bpm)}); your take peaks at ${dB(pk)}`);
  await sleep(Math.max(0,A0.L*2*1000-1000)); const q1=await ask('How does the loop sound against the metronome?',['in time','a little late','a little early','off']); dgLine(id,`· the loop against the metronome: ${['in time','a little late','a little early','off'][q1]||'no answer'}`); if(q1<0) return;
  const q0=await ask('When you closed the loop, did it start again the moment you pressed?',['at once','a little late','late']); dgLine(id,`· the loop came back ${['at once','a little late','late'][q0]||'(no answer)'} after the press`); if(q0<0) return;
  if(!(await stepWait('Switch 6 keeps it','',()=>A0.layers[0].state==='accepted',30000))) return; dgLine(id,'✓ kept');
  const src0=S.src; if(S.src!=='syn'&&!(await stepWait('Switch 5: your guitar becomes the synth','The sound is the one chosen in Sounds.',()=>S.src==='syn',30000))) return;
  const n0=A0.layers.length; if(!(await stepWait('Switch 1, play single notes for one time round','Switch 1 again to stop. The synth version follows a moment later.',()=>A0.layers.length>n0&&!E.rec&&!A0.layers.some(l=>l._busy),90000))) return;
  const sl=A0.layers[A0.layers.length-1], t0=performance.now(); await waitFor(()=>DG.stop||(sl.notes!=null&&!sl._rendering),20000,50);
  dgLine(id,`${sl.notes!=null?'✓':'✗'} synth layer: ${sl.notes!=null?`${sl.notes} notes, ready ${((performance.now()-t0)/1000).toFixed(1)} s after you closed it`:'not rendered'}`);
  await sleep(A0.L*1000); const q2=await ask('How does the synth layer sound?',['right notes, in time','wrong notes','out of time','did not hear it']); dgLine(id,`· the synth layer: ${['right notes, in time','wrong notes','out of time','not heard'][q2]||'no answer'}`); if(q2<0) return;
  if(!(await stepWait('Switch 6 keeps it','',()=>sl.state==='accepted',30000))) return;
  if(src0!=='syn'&&!(await stepWait('Switch 5: back to raw guitar','',()=>S.src==='gtr',30000))) return;
  if(!(await stepWait('Switch 2 stops','The print to the TP-7 starts 2 s later (about 30 s).',()=>E.st==='printing',30000))) return;
  if(!(await stepWait('Printing…','',()=>E.st!=='printing',180000))) return; dgLine(id,`${toPrint().length?'✗':'✓'} print: ${E.msg}${E.small?' '+E.small:''}`);
  banner('The TP-7 plays section A','Listen to the loop from the TP-7 itself.'); await tapePlay(0,true); await sleep(A0.L*2.6*1000); await tapeStop(); banner('');
  const q3=await ask('How did the TP-7 play it back?',['like the app did','guitar and synth apart','gap or click at the loop','did not hear it']); dgLine(id,`· TP-7 playback: ${['like the app','guitar and synth apart','gap or click at the loop','not heard'][q3]||'no answer'}`);
  await perfReady(); dgLine(id,'Done. This session stays: carry on playing, or tap switch 6 four times for a new one.');
  } finally { diagHide(false); } }
// the guided test runs with the app's own screens: the diagnostics screen steps aside and comes back after
function diagHide(on){ const d=$('#diag'); if(!d) return; if(on){ d.hidden=true; DG.hid=true; showTab('Arr'); } else if(DG.hid){ d.hidden=false; DG.hid=false; diagRender(); } }

function diagReport(){ const L=[`Tinebox Loop diagnostics, ${new Date().toLocaleString()}`,`Build ${APP_BUILD}`,`TP-7: ${TP.info?JSON.stringify(TP.info):'no greet reply'}`,
  ctx?`Audio: ${ctx.sampleRate} Hz, ${ctx.destination.maxChannelCount} output channels, base latency ${msTxt(ctx.baseLatency)}, output latency ${msTxt(ctx.outputLatency)}, input ${IN.kind||'closed'}`:'Audio: not started',
  `Settings: ${JSON.stringify({tp:S.tp,synth:S.synth,padFix:S.padFix,printOnStop:S.printOnStop})}`,''];
  TESTS.forEach(t=>{ if(!DG.res[t.id]) return; L.push(`== ${t.name}`,...DG.res[t.id]); const sx=DG.sx[t.id]; if(sx&&sx.length){ const t0=sx[0].t; L.push('-- TP-7 messages',...sx.map(x=>`  ${((x.t-t0)/1000).toFixed(3).padStart(8)} ${x.s}`)); } L.push(''); });
  L.push('== Log',logText(300)); return L.join('\n'); }

// ================================================================== start
(function start(){
  log('app',`page loaded ${new Date().toLocaleString()}, build ${APP_BUILD}`);
  if(S.ses){ S.ses.secs.forEach(s=>s.layers.forEach(l=>{ delete l._busy; delete l._rendering; })); E.st=S.ses.secs.length?'stopped':'idle';
    say(S.ses.secs.length?`Session at ${bpmTxt(S.ses.bpm)} bpm, ${S.ses.secs.length} section${S.ses.secs.length>1?'s':''}.`:'Tinebox Loop',S.ses.secs.length?'Connect the TP-7 (Settings), then switch 2 plays. '+pendTxt():'Connect the TP-7 (Settings), then tap switch 6 four times for a session.'); }
  else say('Tinebox Loop','Connect the TP-7 (Settings), then tap switch 6 four times for a session.');
  showTab('Arr');
  // MIDI browsers grant access without a prompt: connect at once (a tap is still needed for audio)
  if(navigator.requestMIDIAccess) setTimeout(()=>{ midiConnect().then(ok=>{ if(ok&&midiReady()&&R.sysex) sxAlive().then(m=>{ if(m) setMidiNote(`TP-7 answers (${m} mode).`); renderAll(); }); }); },300);
  const unlock=()=>{ initAudio(); document.removeEventListener('pointerdown',unlock,true); document.removeEventListener('keydown',unlock,true); };
  document.addEventListener('pointerdown',unlock,true); document.addEventListener('keydown',unlock,true);
})();
